# ── Add as .github/workflows/backfill-polar-exercises.yml ──
#
# ONE-OFF workflow, manual trigger only. Runs backfill_polar_exercises.py,
# which replays already-captured raw exercise data (from an earlier
# diagnostic log, hardcoded in the script) against the CURRENT runs.csv
# using the real, now-fixed matching logic, and commits the result.
#
# No Polar API call — this is pure local recomputation against data
# already on disk plus data already captured in chat/logs. Safe to run
# once; delete this workflow and backfill_polar_exercises.py afterward.

name: Backfill Polar Exercises

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill script
        run: python3 backfill_polar_exercises.py

      - name: Commit polar_exercises.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add polar_exercises.csv
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "polar_exercises.csv: backfill using fixed matching logic"
          git push
