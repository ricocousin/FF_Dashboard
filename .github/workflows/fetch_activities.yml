      - name: Commit and push data files
        if: steps.dst_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in runs.csv summary.json strength.csv lactate.json coach_summary.json api_usage.json steps.csv sleep.csv polar_steps.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Skipping $f — not present this run"
            fi
          done
          git diff --staged --quiet || git commit -m "Update activity data"
          git push