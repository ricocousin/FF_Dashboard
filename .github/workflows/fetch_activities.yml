name: Sync Training Data
on:
  schedule:
    - cron: '0 4 * * *'   # 6am Danish time in summer (UTC+2)
    - cron: '0 5 * * *'   # 6am Danish time in winter (UTC+1)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full refresh (rebuilds all data from scratch)'
        required: false
        default: false
        type: boolean
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check if this is the correct Danish local hour
        id: dst_check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run via workflow_dispatch — bypassing DST hour check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            DK_HOUR=$(TZ='Europe/Copenhagen' date +%H)
            echo "Danish local hour right now: $DK_HOUR"
            if [ "$DK_HOUR" == "06" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping — this cron fire doesn't match current Danish 6am (DST offset)."
            fi
          fi
      - name: Set up Python
        if: steps.dst_check.outputs.run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.dst_check.outputs.run == 'true'
        run: pip install garminconnect
      - name: Run fetch script
        if: steps.dst_check.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_USER_ID: ${{ secrets.POLAR_USER_ID }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: python fetch_activities.py
      - name: Build dashboard metrics + AI coach
        if: steps.dst_check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_dashboard.py
      - name: Commit and push data files
        if: steps.dst_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in runs.csv strength.csv lactate.json coach_summary.json api_usage.json steps.csv sleep.csv polar_steps.csv dashboard_metrics.json fetch_status.json polar_hr.csv run_hr_samples.csv coach_context.json garmin_fitness_metrics.csv polar_cardio_load.csv polar_exercises.csv polar_pending_transaction.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Skipping $f — not present this run"
            fi
          done
          git diff --staged --quiet || git commit -m "Update activity data"

          # Retry-with-rebase push: added after a real failure where this
          # workflow's push was rejected because another workflow (a manual
          # one-off run, in that specific case) had pushed to main in the
          # gap between this job's checkout and its own push attempt. A
          # plain `git push` has no way to recover from that — it just
          # fails outright, and whatever this run fetched (sleep, steps,
          # continuous HR, cardio load, HR samples — everything, not just
          # the file that changed) never reaches GitHub even though the
          # script itself completed successfully. All of these data files
          # are deterministically regenerated from source each run, so
          # rebasing onto whatever's newest on main and re-pushing is safe
          # here — there's no meaningful "merge conflict" to resolve by
          # hand, just freshest-wins on each file. Retries a few times
          # since this project has repeatedly seen overlapping-workflow-run
          # issues (duplicate commits, Pages deployment races, and now
          # this) during active manual testing sessions specifically.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts — giving up, see error above"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — pulling and rebasing before retry"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
