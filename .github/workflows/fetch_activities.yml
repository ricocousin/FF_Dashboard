name: Sync Training Data
on:
  schedule:
    # Several morning fires (04:00-07:00 UTC = ~06:00-09:00 Danish across DST).
    # GitHub's scheduled runs are best-effort and are frequently delayed or
    # dropped, so multiple shots make it very likely at least one fires each
    # morning. The "run gate" step below makes every fire after the day's first
    # successful fetch a no-op, so the extra crons cost nothing and a dropped
    # early fire just means a slightly later update that morning — never a
    # missed day. (The old design fired only 04:00/05:00 and proceeded only if
    # the Danish hour was exactly 06, so any delayed fire was cancelled
    # outright — that turned GitHub's flakiness into skipped days.)
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full refresh (rebuilds all data from scratch)'
        required: false
        default: false
        type: boolean
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Decide whether to run (once per Danish day; delay/drop tolerant)
        id: dst_check
        run: |
          # Idempotency gate: run only if we have NOT already had a successful
          # fetch today (Danish date). fetch_status.json's last_success_date is
          # written only when fetch_activities.py completes successfully, so:
          #   - whichever morning cron fires first (even if GitHub delayed it)
          #     does the day's update;
          #   - every later fire that same day finds last_success_date == today
          #     and no-ops;
          #   - if a fetch FAILS, last_success_date stays stale, so the next
          #     cron that morning automatically retries.
          # No exact-hour check, so a delayed fire is never cancelled.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run via workflow_dispatch — always proceed."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            TODAY_DK=$(TZ='Europe/Copenhagen' date +%F)
            LAST=$(sed -n 's/.*"last_success_date": *"\([0-9-]*\)".*/\1/p' fetch_status.json 2>/dev/null)
            echo "Danish date today: $TODAY_DK | last successful fetch: ${LAST:-<none>}"
            if [ "$LAST" == "$TODAY_DK" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Already updated today — skipping (idempotent no-op)."
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Not yet updated today — proceeding."
            fi
          fi
      - name: Set up Python
        if: steps.dst_check.outputs.run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.dst_check.outputs.run == 'true'
        run: pip install garminconnect
      - name: Run fetch script
        if: steps.dst_check.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_USER_ID: ${{ secrets.POLAR_USER_ID }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh }}
        run: python fetch_activities.py
      - name: Build dashboard metrics + AI coach
        if: steps.dst_check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_dashboard.py
      - name: Commit and push data files
        if: steps.dst_check.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for f in runs.csv strength.csv lactate.json coach_summary.json api_usage.json steps.csv sleep.csv polar_steps.csv dashboard_metrics.json fetch_status.json polar_hr.csv run_hr_samples.csv coach_context.json garmin_fitness_metrics.csv polar_cardio_load.csv polar_exercises.csv polar_pending_transaction.json hikes.csv model_ab_log.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "Skipping $f — not present this run"
            fi
          done
          git diff --staged --quiet || git commit -m "Update activity data"

          # Retry-with-reset push: replaces an earlier `git rebase` version
          # of this step that caused a real duplication bug. EVERY file this
          # workflow commits is fully regenerated from source each run —
          # none are hand-edited — so on a rejected push, the correct
          # recovery is to discard the stale local commit and re-commit our
          # already-fresh working tree on top of whatever's now on main, not
          # to textually merge the two. `git rebase` does a line-based 3-way
          # merge: two commits that each contain a full, independently
          # regenerated rewrite of the same CSV look to git like two
          # non-conflicting sets of added lines, so rebase silently
          # interleaved BOTH versions — duplicating every row exactly once.
          # `git reset --soft` avoids this entirely: it moves the branch
          # pointer without touching the working tree, so our freshly
          # written files simply become "uncommitted changes on top of the
          # new remote HEAD" and get re-committed as a single clean
          # snapshot — never diffed/merged against the old committed
          # version at the line level.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts — giving up, see error above"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — resetting onto latest main and re-committing (not rebasing, see note above)"
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Update activity data"
            sleep 3
          done
