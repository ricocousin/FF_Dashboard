<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred's Feats</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:        #0d0d0f;
      --surface:   #141417;
      --border:    #1f1f24;
      --muted:     #3a3a42;
      --text-dim:  #6b6b78;
      --text:      #c8c8d4;
      --text-hi:   #eeeef4;
      --accent:    #e8ff5a;
      --accent2:   #ff6b35;
      --strength:  #4a9eff;
      --steps:     #f472b6;
      --intensity: #a78bfa;
      --recovery:  #fbbf24;
      --load:      #22d3ee;
      --font-display: 'Syne', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.6; min-height: 100vh; }
    header { border-bottom: 1px solid var(--border); padding: 2rem 2rem 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: var(--text-hi); letter-spacing: -0.03em; line-height: 1; }
    .logo span { color: var(--accent); }
    .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .cal-with-streak { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-hi); }
    .cal-nav { display: flex; gap: 0.5rem; }
    .cal-nav button { background: var(--border); border: none; color: var(--text-dim); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:hover { background: var(--muted); color: var(--text-hi); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-align: center; padding: 2px 0 4px; text-transform: uppercase; }
    .cal-day { height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; min-width: 0; gap: 1px; }
    .cal-day-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); line-height: 1; }
    .cal-day.today { background: var(--border); }
    .cal-day.today .cal-day-num { color: var(--text-hi); }
    .cal-day.future .cal-day-num { color: var(--muted); opacity: 0.35; }
    .cal-day.has-activity { background: rgba(255,255,255,0.03); }
    .cal-icons { display: flex; gap: 1px; align-items: center; justify-content: center; }
    .cal-icon { width: 11px; height: 11px; }
    .streak-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .streak-col-spacer { height: 20px; }
    .cal-row-wrap { height: 36px; display: flex; align-items: center; justify-content: center; }
    .streak-week { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-family: var(--font-mono); font-size: 10px; }
    .streak-week.done { background: var(--accent2); color: white; }
    .streak-week.empty { background: var(--border); color: var(--muted); }
    .streak-week.current-fire { font-size: 15px; background: transparent; }
    .streak-total { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
    .streak-count { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent2); line-height: 1; }
    .streak-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    main { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; gap: 1.5rem; }
    .overview-block { border: 1px solid var(--border); background: var(--border); display: flex; flex-direction: column; gap: 1px; }
    .overview-full { background: var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
    .coach-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .coach-header { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.5rem; }
    .coach-headline { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--text-hi); line-height: 1.35; margin: 0.1rem 0 0.3rem; }
    .coach-confidence { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.4rem; }
    .coach-confidence-bar { width: 40px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
    .coach-confidence-fill { height: 100%; border-radius: 2px; }
    .coach-confidence-attention { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-bottom: 0.6rem; opacity: 0.8; }
    .coach-watch { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-watch-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .coach-watch-item { font-family: var(--font-body); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; padding-left: 1.1rem; position: relative; }
    .coach-watch-item + .coach-watch-item { margin-top: 0.35rem; }
    .coach-watch-item::before { content: '◦'; position: absolute; left: 0; color: var(--recovery); font-family: var(--font-mono); }
    .coach-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .coach-insight { font-family: var(--font-body); font-size: 13.5px; color: var(--text); line-height: 1.65; padding-left: 1.1rem; position: relative; }
    .coach-insight + .coach-insight { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-insight::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-family: var(--font-mono); }
    .coach-updated { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.25rem; }
    .coach-usage { font-family: var(--font-mono); font-size: 9px; color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.03em; }
    .overview-label { grid-column: 1 / -1; background: var(--surface); font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.5rem 1.5rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }
    .overview-label.run { color: var(--accent); }
    .overview-label.lift { color: var(--strength); }
    .overview-label.steps { color: var(--steps); }
    .overview-label.intensity { color: var(--intensity); }
    .overview-label.recovery { color: var(--recovery); }
    .overview-label.load { color: var(--load); }
    .stat { background: var(--surface); padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .stat-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .stat-value { font-family: var(--font-display); font-size: clamp(1.3rem, 2.5vw, 1.9rem); font-weight: 700; color: var(--text-hi); line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.blue { color: var(--strength); }
    .stat-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .stat-sub.cross-ref { opacity: 0.8; }
    .section-heading { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.75rem; margin-top: 0.25rem; }
    .section-heading::before { content: ''; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; }
    .card-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; gap: 1rem; }
    .card-title-row .card-title { margin-bottom: 0; flex: 1; }
    .efforts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--border); }
    .effort { background: var(--surface); padding: 1rem 1.25rem; }
    .effort-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.3rem; }
    .effort-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .effort-detail { font-family: var(--font-mono); font-size: 10px; color: var(--text); margin-top: 0.25rem; }
    .effort-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 0.1rem; white-space: normal; overflow-wrap: break-word; }
    .effort-date { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.1rem; }
    .lt-grid { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: start; }
    .lt-values { display: flex; flex-direction: column; gap: 0.75rem; }
    .lt-main { display: flex; flex-direction: column; gap: 0.1rem; }
    .lt-pace { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .lt-hr { font-family: var(--font-mono); font-size: 13px; color: var(--accent2); }
    .lt-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .zones { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .zone { display: grid; grid-template-columns: 70px 1fr 150px; align-items: center; gap: 0.75rem; font-family: var(--font-mono); font-size: 11px; }
    .zone-name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .zone-bar-track { height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
    .zone-bar-fill { height: 100%; border-radius: 2px; }
    .zone-pace { color: var(--text); white-space: nowrap; text-align: right; min-width: 170px; }
    .chart-wrap { position: relative; height: 220px; }
    .year-bar-track { height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
    .year-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s ease; }
    .year-bar-fill.overflow { background: var(--accent2); }
    .year-bar-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
    .loading { text-align: center; padding: 4rem 2rem; font-family: var(--font-mono); color: var(--text-dim); font-size: 12px; letter-spacing: 0.1em; }
    .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }

    /* ── Zone-time card ─────────────────────────────────────────────────── */
    .zt-toggle { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .zt-toggle button { background: var(--border); border: none; color: var(--text-dim); padding: 0.4rem 0.75rem; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .zt-toggle button:hover { color: var(--text-hi); }
    .zt-toggle button.active { background: var(--accent); color: #0d0d0f; font-weight: 700; }
    .zt-stack { display: flex; width: 100%; height: 22px; border-radius: 4px; overflow: hidden; background: var(--muted); }
    .zt-stack-seg { height: 100%; }
    .zt-legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; margin: 0.75rem 0 1.25rem; }
    .zt-legend-item { display: flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }
    .zt-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .zt-goals { display: flex; flex-direction: column; gap: 0.9rem; }
    .zt-goal-label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 0.3rem; }
    .zt-goal-label b { color: var(--text-hi); font-weight: 500; }
    .zt-empty { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }

    /* ── Strength HR / Garmin-vs-Polar card ─────────────────────────────── */
    .hr-subcard-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .hr-subcard { margin-bottom: 1.75rem; }
    .hr-subcard:last-child { margin-bottom: 0; }

    /* ── Coach section narrative (per-card grouped paragraph, replaces the
       old evidence/digest tile-note system — July 2026) ──────────────── */
    .coach-section-note { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); font-family: var(--font-body); font-size: 12.5px; color: var(--text); line-height: 1.65; grid-column: 1 / -1; }
    .coach-section-label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.4rem; }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:0.75rem">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <path d="M4 26 L14 12 L20 18 L30 4" stroke="#e8ff5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 30 L12 19 L18 24 L28 10" stroke="#ff6b35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    </svg>
    <div class="logo">FRED'S <span>FEATS</span></div>
  </div>
  <div class="last-updated" id="last-updated">Loading…</div>
</header>
<main id="app">
  <div class="loading"><span class="pulse"></span>Fetching activity data…</div>
</main>
<script>
const $ = id => document.getElementById(id);

function fmt(n, dec = 1) { if (n === null || n === undefined || n === '') return '—'; return Number(n).toFixed(dec); }
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function secToPace(s) { if (s === null || s === undefined || s <= 0 || !isFinite(s)) return '—'; const total = Math.round(s); return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`; }
function fmtHrs(mins) { if (!mins || mins <= 0) return '—'; const h = Math.floor(mins / 60); const m = Math.round(mins % 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function fmtDuration(timeStr) { if (!timeStr) return '—'; const parts = timeStr.split(':').map(Number); if (parts.length === 3) { const [h, m, s] = parts; if (h > 0) return `${h}h ${m}m`; return `${m}m ${s}s`; } return timeStr; }
function arrowFor(qual, delta) { if (qual === 'Stable' || qual === null || qual === undefined) return '▬'; if (qual === 'Increased') return '▲'; if (qual === 'Decreased') return '▼'; return delta > 0 ? '▲' : delta < 0 ? '▼' : '▬'; }
Chart.defaults.color = '#6b6b78'; Chart.defaults.borderColor = '#1f1f24'; Chart.defaults.font.family = "'DM Mono', monospace";
function chartOpts(extra = {}) { return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10 } }, scales: { x: { grid: { color: '#1f1f24' }, ticks: { maxRotation: 0 } }, y: { grid: { color: '#1f1f24' } } }, ...extra }; }

// Zone colors — match the LT card's _calc_zones() palette exactly, so a
// zone reads the same color everywhere on the dashboard.
const ZONE_COLORS = { Z1: '#4a9eff', Z2: '#7bc67e', Z3: '#e8ff5a', Z4: '#ff9f40', Z5: '#ff6b35' };
const ZONE_LABELS = { Z1: 'Z1 Easy', Z2: 'Z2 Aerobic', Z3: 'Z3 Tempo', Z4: 'Z4 LTHR', Z5: 'Z5 Hard' };

async function init() {
  const fileStatus = {};
  const safeFetch = (name, url) =>
    fetch(url)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => { fileStatus[name] = 'ok'; return data; })
      .catch(e => { fileStatus[name] = `failed: ${e.message}`; return null; });

  const [m, coachData] = await Promise.all([
    safeFetch('metrics', 'dashboard_metrics.json'),
    safeFetch('coach', 'coach_summary.json')
  ]);

  if (!m) {
    const statusLines = Object.entries(fileStatus).map(([name, status]) => `${name}: ${status}`).join('<br>');
    document.getElementById('app').innerHTML = `<div class="loading">Failed to load core data (dashboard_metrics.json).<br><small>${statusLines}</small></div>`;
    return;
  }

  $('last-updated').textContent = `Updated ${m.last_updated}`;
  const app = $('app');
  app.innerHTML = '';

  // ── Coach section narrative ────────────────────────────────────────────────
  // REPLACED (July 2026, athlete direction): evidence and digest are gone
  // entirely — the coach now writes ONE short paragraph per named group
  // directly (coachData.sections.overview/trends/threshold/zones/
  // hr_comparison/calendar/personal_bests), pre-grouped in the prompt
  // itself rather than assembled here from scattered one-liners. This
  // fixes the earlier duplication problem structurally: each card gets
  // exactly one coach note, written once, not reused across multiple
  // cards. Returns '' when a section is empty so it's always safe to
  // splice into a template string.
  function coachSectionHtml(key) {
    const text = coachData && coachData.sections && coachData.sections[key];
    if (!text) return '';
    return `<div class="coach-section-note"><div class="coach-section-label">Coach</div>${escapeHtml(text)}</div>`;
  }

  // ── Freshness indicator (single dot + label for the whole overview panel) ────
  // Restored — reads data_freshness directly (fresh/stale/failed), decoupled
  // from the confidence score's own separate read of the same underlying
  // fetch_status.json. One indicator for the whole panel since every tile
  // below shares the same daily fetch, not one per tile.
  if (m.data_freshness) {
    const df = m.data_freshness;
    const freshColor = df.status === 'fresh' ? '#7bc67e' : df.status === 'stale' ? '#ff9f40' : '#ff6b35';
    const freshLabel = df.status === 'fresh' ? 'Data fresh'
      : df.status === 'stale' ? `Data stale (${df.age_days}d old)`
      : (df.last_success_date ? `Fetch failed (last success ${df.last_success_date})` : 'No successful fetch found');
    const freshBar = document.createElement('div');
    freshBar.style.cssText = 'display:flex;align-items:center;gap:0.5rem;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);padding:0 0.25rem;';
    freshBar.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${freshColor};flex-shrink:0"></span>${escapeHtml(freshLabel)}`;
    app.appendChild(freshBar);
  }

  // ── Coach card ────────────────────────────────────────────────────────────────
  // Shrunk further (July 2026, second pass — per athlete direction): this
  // card now carries ONLY headline (up to 3 short sentences) + confidence.
  // The old single SUMMARY paragraph is gone entirely — the coach now
  // writes one grouped narrative paragraph per card (Overview, Trends,
  // Threshold, Zones, HR comparison, Calendar, Personal bests), each
  // rendered directly on its own card via coachSectionHtml() below, not
  // duplicated here. Evidence is gone completely too, per direct athlete
  // request — data-import confirmation is the freshness dots' job, not a
  // numbered evidence list's.
  if (coachData && coachData.headline) {
    const coachCard = document.createElement('div');
    coachCard.className = 'coach-card';
    const headlineHtml = `<div class="coach-headline">${escapeHtml(coachData.headline)}</div>`;
    const confidenceHtml = (coachData.confidence_pct !== undefined && coachData.confidence_pct !== null) ? (() => {
      const pct = coachData.confidence_pct;
      const label = coachData.confidence_label || '';
      const reasons = Array.isArray(coachData.confidence_reasons) ? coachData.confidence_reasons.join(' · ') : '';
      const barColor = pct >= 85 ? '#7bc67e' : pct >= 65 ? '#e8ff5a' : '#ff9f40';
      return `<div class="coach-confidence" title="${escapeHtml(reasons)}"><div class="coach-confidence-bar"><div class="coach-confidence-fill" style="width:${pct}%;background:${barColor}"></div></div><span>${pct}% · ${escapeHtml(label)}</span></div>`;
    })() : '';
    const attentionHtml = coachData.confidence_attention ? `<div class="coach-confidence-attention">${escapeHtml(coachData.confidence_attention)}</div>` : '';

    function usageColor(usd) { if (usd < 0.004) return '#4a9eff'; if (usd < 0.008) return '#7bc67e'; if (usd < 0.015) return '#e8ff5a'; if (usd < 0.025) return '#ff9f40'; return '#ff6b35'; }
    function mtdColor(usd) { if (usd < 0.10) return '#4a9eff'; if (usd < 0.25) return '#7bc67e'; if (usd < 0.35) return '#e8ff5a'; if (usd < 0.42) return '#ff9f40'; return '#ff6b35'; }
    function ytdColor(usd) { if (usd < 1.00) return '#4a9eff'; if (usd < 2.50) return '#7bc67e'; if (usd < 3.50) return '#e8ff5a'; if (usd < 4.50) return '#ff9f40'; return '#ff6b35'; }
    const u = coachData.usage;
    const usageHtml = u ? (() => { const dc = usageColor(u.cost_usd); const mc = mtdColor(coachData.usage_mtd_usd || 0); const yc = ytdColor(coachData.usage_ytd_usd || 0); return `<div class="coach-usage"><div><span style="color:${dc}">${u.input_tokens.toLocaleString()} it · ${u.output_tokens.toLocaleString()} ot · $${u.cost_usd.toFixed(4)} / ${u.cost_dkk.toFixed(3)} kr</span></div><div><span style="color:${mc}">MTD $${(coachData.usage_mtd_usd || 0).toFixed(4)} / ${(coachData.usage_mtd_dkk || 0).toFixed(3)} kr</span></div><div><span style="color:${yc}">YTD $${(coachData.usage_ytd_usd || 0).toFixed(4)} / ${(coachData.usage_ytd_dkk || 0).toFixed(3)} kr</span></div><div class="coach-usage-scale"><div style="background:linear-gradient(to right,#4a9eff,#7bc67e,#e8ff5a,#ff9f40,#ff6b35);height:2px;border-radius:1px;margin-top:4px;opacity:0.5"></div><div style="display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:2px"><span>min</span><span>normal</span><span>elevated</span><span>high</span><span>max</span></div></div></div>`; })() : '';
    // Only the generated-timestamp/usage footer stays behind the toggle
    // now — there's no large summary blob left to hide.
    const detailsToggleHtml = `<button id="coachDetailsToggle" style="background:var(--border);border:none;color:var(--text-dim);padding:0.35rem 0.7rem;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;align-self:flex-start;margin-top:0.2rem">Show details ▾</button>`;
    const detailsHtml = `<div id="coachDetails" style="display:none"><div class="coach-updated">Generated ${coachData.last_updated}</div>${usageHtml}</div>`;
    coachCard.innerHTML = `<div class="coach-header"><span class="coach-dot"></span>Training status</div>${headlineHtml}${confidenceHtml}${attentionHtml}${detailsToggleHtml}${detailsHtml}`;
    app.appendChild(coachCard);
    const coachDetailsEl = $('coachDetails');
    const coachToggleBtn = $('coachDetailsToggle');
    coachToggleBtn.onclick = () => {
      const isHidden = coachDetailsEl.style.display === 'none';
      coachDetailsEl.style.display = isHidden ? 'block' : 'none';
      coachToggleBtn.textContent = isHidden ? 'Hide details ▴' : 'Show details ▾';
    };
  }

  // ── Overview block ────────────────────────────────────────────────────────────
  // changeLine(): ONE sentence per comparison (arrow + direction word + value
  // + comparison label), e.g. "▲ Increased 2.3 km vs last week". Restored —
  // a prior index.html version had regressed back to the pre-fix pattern of
  // a deltaBadge ("▲ 2.3 km") immediately followed by a separate qualLine
  // ("Increased vs last week") saying the same thing twice; that duplicate
  // pattern was already fixed once (see PROJECT_CONTEXT OVERVIEW PANEL
  // REDESIGN) and must not be reintroduced.
  const changeLine = (delta, qual, compareLabel, formatFn) => {
    if (delta === null || delta === undefined || !qual) return '';
    const arrow = arrowFor(qual, delta);
    const text = qual === 'Stable'
      ? `Stable — no meaningful change vs ${compareLabel}`
      : `${qual} ${formatFn(Math.abs(delta))} vs ${compareLabel}`;
    return `<br><span style="color:var(--text-dim)">${arrow} ${text}</span>`;
  };

  const r = m.running, st = m.strength, sp = m.steps, iv = m.intensity, rc = m.recovery, cl = m.cardio_load || {};

  // ── Per-tile freshness dots ───────────────────────────────────────────────
  // Running/Strength/Intensity deliberately reuse the SAME pipeline-level
  // status as the global overview dot — a real per-day check would show
  // stale on every ordinary rest day, which isn't a freshness problem.
  // Steps/Recovery/Load get a real per-day check from m.tile_freshness,
  // since those are genuinely continuous data. See PROJECT_CONTEXT for
  // the full reasoning (option B, chosen after sparring).
  function tileFreshDot(status) {
    const color = status === 'fresh' ? '#7bc67e' : status === 'stale' ? '#ff9f40' : '#ff6b35';
    const title = status === 'fresh' ? 'Fresh — up to date as of yesterday'
      : status === 'stale' ? 'Stale — no confirmed data for yesterday yet'
      : 'Freshness unclear — check the pipeline';
    return `<span title="${escapeHtml(title)}" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${color};margin-left:0.5rem;vertical-align:middle"></span>`;
  }
  const pipelineStatus = (m.data_freshness && m.data_freshness.status) || 'failed';
  const tf = m.tile_freshness || {};
  const runningFreshDot = tileFreshDot(pipelineStatus);
  const strengthFreshDot = tileFreshDot(pipelineStatus);
  const intensityFreshDot = tileFreshDot(pipelineStatus);
  const stepsFreshDot = tileFreshDot(tf.steps || 'failed');
  const recoveryFreshDot = tileFreshDot(tf.recovery || 'failed');
  const loadFreshDot = tileFreshDot(tf.load || 'failed');

  const runChangeHtml = changeLine(r.week_delta_km, r.week_qual, 'last week', v => `${v.toFixed(1)} km`);
  const strengthChangeHtml = changeLine(st.week_delta_sessions, st.week_qual, 'last week', v => `${Math.round(v)}`);
  const stepsChangeHtml = sp.avg_7d !== null ? changeLine(sp.delta_7d_vs_30d, sp.qual, '30d average', v => `${Math.round(v).toLocaleString()}`) : '';
  const stepsDiscrepancyHtml = sp.discrepancy_avg !== null ? `<br><span style="color:var(--text-dim)">Polar vs iPhone: ±${sp.discrepancy_avg.toLocaleString()}/day (${sp.discrepancy_days}d overlap)</span>` : '';
  const intensityChangeHtml = changeLine(iv.delta_month_vs_year, iv.qual, 'year average', v => fmtHrs(v));
  const recoveryChangeHtml = changeLine(rc.delta_week_vs_month, rc.qual, 'month average', v => fmtHrs(v));

  const cardioCrossRefHtml = (cl.ratio !== null && cl.ratio !== undefined)
    ? `<br><span class="cross-ref" style="color:var(--load)">Strain:tolerance ${cl.ratio.toFixed(2)}${cl.status ? ' · ' + escapeHtml(cl.status) : ''}</span>`
    : '';

  const stepsRow = (sp.avg_all_time !== null) ? `<div class="overview-full"><div class="overview-label intensity" style="grid-column:1/-1;color:var(--steps)">Steps${stepsFreshDot}</div><div class="stat"><span class="stat-label">Avg / day (all time)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_all_time?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps</span></div><div class="stat"><span class="stat-label">Avg / day (7d)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_7d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps${stepsChangeHtml}</span></div><div class="stat"><span class="stat-label">Avg / day (30d)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_30d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps${stepsDiscrepancyHtml}</span></div></div>` : '';

  const recoveryTile = (label, data, changeHtml, crossRefHtml) => {
    const durationStr = data && data.mins ? fmtHrs(data.mins) : '—';
    const scoreStr = data && data.score !== null && data.score !== undefined ? `Score: ${Math.round(data.score)}` : 'Score: —';
    return `<div class="stat"><span class="stat-label">${label}</span><span class="stat-value" style="color:var(--recovery)">${durationStr}</span><span class="stat-sub">${scoreStr}${changeHtml || ''}${crossRefHtml || ''}</span></div>`;
  };
  const recoveryRow = (rc.week.mins !== null || rc.month.mins !== null || rc.year.mins !== null) ? `<div class="overview-full"><div class="overview-label recovery" style="grid-column:1/-1">Recovery${recoveryFreshDot}</div>${recoveryTile('Avg / week', rc.week, recoveryChangeHtml, cardioCrossRefHtml)}${recoveryTile('Avg / month', rc.month)}${recoveryTile('Avg / year', rc.year)}</div>` : '';

  const loadRow = (cl.strain !== null && cl.strain !== undefined) ? `<div class="overview-full"><div class="overview-label load" style="grid-column:1/-1">Load (Polar Cardio)${loadFreshDot}</div><div class="stat"><span class="stat-label">Strain (7d avg)</span><span class="stat-value" style="color:var(--load)">${fmt(cl.strain, 0)}</span><span class="stat-sub">load units</span></div><div class="stat"><span class="stat-label">Tolerance (28d avg)</span><span class="stat-value" style="color:var(--load)">${fmt(cl.tolerance, 0)}</span><span class="stat-sub">load units</span></div><div class="stat"><span class="stat-label">Strain:tolerance ratio</span><span class="stat-value" style="color:var(--load)">${cl.ratio !== null && cl.ratio !== undefined ? cl.ratio.toFixed(2) : '—'}</span><span class="stat-sub">${cl.status ? escapeHtml(cl.status) : '—'}${cl.latest_date ? ' · ' + cl.latest_date : ''}</span></div></div>` : '';

  const overviewBlock = document.createElement('div');
  overviewBlock.className = 'overview-block';
  overviewBlock.innerHTML = `
    <div class="overview-full">
      <div class="overview-label run" style="grid-column:1/-1">Running${runningFreshDot}</div>
      <div class="stat"><span class="stat-label">Avg / run</span><span class="stat-value accent">${fmt(r.avg_per_run_km, 1)} <small style="font-size:.9rem;color:var(--text-dim)">km</small></span><span class="stat-sub">${r.runs_this_year} runs ${m.this_year}</span></div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(r.avg_per_week_km, 1)} <small style="font-size:.9rem;color:var(--text-dim)">km</small></span><span class="stat-sub">${fmt(r.total_distance_this_year_km, 0)} km ${m.this_year}${runChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value accent">${r.current_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${r.longest_weekly_streak ?? '—'} wks</span></div>
    </div>
    <div class="overview-full">
      <div class="overview-label lift" style="grid-column:1/-1">Strength${strengthFreshDot}</div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value blue">${fmt(st.avg_sessions_per_week, 1)}</span><span class="stat-sub">${st.sessions_this_year} sessions ${m.this_year}${strengthChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(st.avg_hours_per_week, 1)} <small style="font-size:.9rem;color:var(--text-dim)">hrs</small></span><span class="stat-sub">${fmt(st.total_hours_this_year, 1)} hrs ${m.this_year}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value blue">${st.current_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${st.longest_weekly_streak ?? '—'} wks</span></div>
    </div>
    ${stepsRow}
    <div class="overview-full">
      <div class="overview-label intensity" style="grid-column:1/-1">Intensity Minutes${intensityFreshDot}</div>
      <div class="stat"><span class="stat-label">Avg / week (${m.this_year})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(iv.avg_week_year_mins)}</span><span class="stat-sub">${fmtHrs(iv.avg_week_year_run_mins)} run · ${fmtHrs(iv.avg_week_year_lift_mins)} lift</span></div>
      <div class="stat"><span class="stat-label">Avg / week (${m.this_month_short})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(iv.avg_week_month_mins)}</span><span class="stat-sub">${fmtHrs(iv.avg_week_month_run_mins)} run · ${fmtHrs(iv.avg_week_month_lift_mins)} lift${intensityChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Streak vs ${iv.goal_mins}min goal</span><span class="stat-value" style="color:var(--intensity)">${iv.streak_weeks} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${iv.best_streak_weeks} wks</span></div>
    </div>
    ${recoveryRow}
    ${loadRow}
  `;
  // Single combined Overview narrative, covering Running/Strength/Steps/
  // Intensity/Recovery/Load together as ONE picture — deliberately shown
  // once here, not repeated per tile (that repetition was the whole
  // problem with the old evidence/digest system). Own surface-colored
  // wrapper to match the visual rhythm of the tile rows above it.
  const overviewNoteText = coachSectionHtml('overview');
  if (overviewNoteText) {
    // Coach note first, above the tiles, so it reads before the data.
    overviewBlock.innerHTML = `<div style="background:var(--surface);padding:1rem 1.5rem">${overviewNoteText}</div>` + overviewBlock.innerHTML;
  }
  app.appendChild(overviewBlock);

  // ── 16-week chart card ────────────────────────────────────────────────────────
  const comparisonGrid = document.createElement('div');
  comparisonGrid.className = 'card';
  comparisonGrid.innerHTML = `<div class="card-title">Weekly distance & strength — last 16 weeks</div>${coachSectionHtml('trends')}<div class="chart-wrap"><canvas id="optionAChart"></canvas></div>`;
  app.appendChild(comparisonGrid);

  // ── Annual chart card ────────────────────────────────────────────────────────
  const ca = m.chart_annual;
  const grid1 = document.createElement('div');
  grid1.className = 'card';
  grid1.innerHTML = `
    <div class="card-title">Distance & strength sessions ${m.this_year}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${ca.target_label}</span>
          <span style="font-family:var(--font-display);font-size:1.4rem;color:${ca.is_overflow ? 'var(--accent2)' : 'var(--accent)'}">${fmt(ca.raw_pct, 0)}%</span>
        </div>
        <div class="year-bar-track"><div class="year-bar-fill${ca.is_overflow ? ' overflow' : ''}" style="width:${ca.display_pct}%"></div></div>
        <div class="year-bar-labels"><span>${fmt(ca.year_dist_km, 0)} km done</span><span>${ca.is_overflow ? '+' + fmt(ca.km_to_target_km, 0) + ' km ahead' : fmt(ca.km_to_target_km, 0) + ' km to go'}</span></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${ca.strength_target_label}</span>
          <span style="font-family:var(--font-display);font-size:1.4rem;color:${ca.strength_overflow ? 'var(--accent2)' : 'var(--strength)'}">${ca.strength_pct !== null ? ca.strength_pct + '%' : ca.strength_sessions_done}</span>
        </div>
        <div class="year-bar-track"><div class="year-bar-fill${ca.strength_overflow ? ' overflow' : ''}" style="width:${ca.strength_display_pct}%;background:var(--strength)"></div></div>
        <div class="year-bar-labels"><span>${ca.strength_sessions_done} sessions done</span><span>${ca.strength_sessions_to_match !== null ? (ca.strength_overflow ? '+' + Math.abs(ca.strength_sessions_to_match) + ' ahead' : ca.strength_sessions_to_match + ' to match') : ''}</span></div>
      </div>
    </div>
    <div class="chart-wrap" style="height:200px"><canvas id="monthChart"></canvas></div>
  `;
  app.appendChild(grid1);

  // ── Lactate Threshold & VO2max (merged card) ──────────────────────────────
  // Merged per athlete request — LT and VO2max shown together with a
  // combined dual-axis trend chart (left: LT pace, reversed since lower is
  // better, matching the existing convention; right: VO2max, higher is
  // better) rather than two separate cards with two separate small charts.
  // The two series have different dates (LT and VO2max readings don't
  // happen on the same days), so the chart is built from the UNION of
  // both series' dates, each dataset supplying null for dates it has no
  // reading on — Chart.js draws a genuine gap rather than a false
  // interpolation across missing data.
  //
  // Freshness dot reuses the pipeline-level status (not a per-day check —
  // neither LT nor VO2max update daily, so "was there a reading yesterday"
  // isn't a meaningful question; what the athlete actually asked for is
  // "does this reflect the latest successful pipeline run," which the
  // pipeline-level signal already answers honestly).
  const ltVo2Card = document.createElement('div');
  ltVo2Card.className = 'card';
  const fm = m.fitness_metrics;
  const hasLt = !!m.lt.latest;
  const hasVo2 = fm && fm.latest_vo2max !== null && fm.latest_vo2max !== undefined;

  if (hasLt || hasVo2) {
    const zonesHtml = m.lt.zones ? m.lt.zones.map(z => `<div class="zone"><span class="zone-name">${z.name}</span><div class="zone-bar-track"><div class="zone-bar-fill" style="width:${z.pct}%;background:${z.color}"></div></div><span class="zone-pace">${z.pace_label}${z.hr_label ? ' · ' + z.hr_label : ''}</span></div>`).join('') : '';

    const ltHeaderHtml = hasLt ? `<div class="lt-main"><span class="lt-label">LT pace</span><span class="lt-pace">${m.lt.latest.lt_pace} /km</span><span class="lt-hr">@ ${m.lt.latest.lt_hr} bpm · ${m.lt.latest.source_date}</span></div>` : `<div class="lt-main"><span class="lt-label">LT pace</span><span class="lt-pace" style="color:var(--text-dim);font-size:1.4rem">No data yet</span></div>`;
    const vo2HeaderHtml = hasVo2 ? `<div class="lt-main"><span class="lt-label">VO2max</span><span class="lt-pace" style="color:var(--strength)">${fmt(fm.latest_vo2max, 1)}</span><span class="lt-hr">${fm.latest_vo2max_precise !== null && fm.latest_vo2max_precise !== undefined ? `precise: ${fmt(fm.latest_vo2max_precise, 1)} · ` : ''}${fm.latest_date ?? ''}</span></div>` : `<div class="lt-main"><span class="lt-label">VO2max</span><span class="lt-pace" style="color:var(--text-dim);font-size:1.4rem">No data yet</span></div>`;

    const ltLabels = (m.lt.trend && m.lt.trend.labels) || [];
    const ltPaceData = (m.lt.trend && m.lt.trend.pace_sec) || [];
    const vo2Labels = (fm && fm.trend && fm.trend.labels) || [];
    const vo2Data = (fm && fm.trend && fm.trend.vo2max) || [];
    const hasCombinedTrend = ltLabels.length > 1 || vo2Labels.length > 1;
    const trendHtml = hasCombinedTrend
      ? `<div class="chart-wrap" style="height:140px;margin-top:1rem"><canvas id="ltVo2Chart"></canvas></div>`
      : `<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:1rem">Trend builds as more readings land — check back soon.</p>`;

    ltVo2Card.innerHTML = `<div class="card-title-row"><div class="card-title">Lactate threshold &amp; VO2max</div>${tileFreshDot(pipelineStatus)}</div>${coachSectionHtml('threshold')}<div class="lt-grid" style="grid-template-columns:1fr 1fr"><div>${ltHeaderHtml}</div><div>${vo2HeaderHtml}</div></div>${hasLt ? `<div style="margin-top:1rem"><div class="lt-label" style="margin-bottom:0.75rem">Training zones</div><div class="zones">${zonesHtml}</div></div>` : ''}${trendHtml}`;
  } else {
    ltVo2Card.innerHTML = `<div class="card-title-row"><div class="card-title">Lactate threshold &amp; VO2max</div>${tileFreshDot(pipelineStatus)}</div>${coachSectionHtml('threshold')}<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">No LT or VO2max data yet.</p>`;
  }
  app.appendChild(ltVo2Card);

  // ── Time in zone card (rolling / last-completed-week toggle) ─────────────────
  // Restored — this card (and the HR comparison card below) went missing
  // from a prior index.html rewrite; both read fields build_dashboard.py
  // has been computing into dashboard_metrics.json the whole time
  // (m.zone_time, m.strength_hr_overlay, m.run_hr_source_comparison), so no
  // backend work was needed, only rebuilding the frontend that reads them.
  const ztCard = document.createElement('div');
  ztCard.className = 'card';
  ztCard.id = 'ztCard';
  app.appendChild(ztCard);

  let ztWindow = (m.zone_time && m.zone_time.default_view) || 'rolling';

  function renderZoneTimeCard() {
    const zt = m.zone_time ? m.zone_time[ztWindow] : null;
    const toggleHtml = `<div class="zt-toggle">
      <button data-win="rolling" class="${ztWindow === 'rolling' ? 'active' : ''}">This week</button>
      <button data-win="last_month" class="${ztWindow === 'last_month' ? 'active' : ''}">Last month</button>
      <button data-win="ytd" class="${ztWindow === 'ytd' ? 'active' : ''}">Year to date</button>
      <button data-win="all_time" class="${ztWindow === 'all_time' ? 'active' : ''}">All time</button>
    </div>`;

    if (!zt || !zt.has_lt_data || !zt.total_minutes) {
      ztCard.innerHTML = `<div class="card-title-row"><div class="card-title">Time in zone</div>${toggleHtml}</div>${coachSectionHtml('zones')}<p class="zt-empty">${!zt || !zt.has_lt_data ? 'No LT reading yet — zone boundaries need a valid LT to compute.' : 'No zone data for this window yet.'}</p>`;
    } else {
      const zones = ['Z1', 'Z2', 'Z3', 'Z4', 'Z5'];
      const stackHtml = zones.map(z => {
        const pct = zt.total_minutes ? (zt.minutes[z] / zt.total_minutes) * 100 : 0;
        return pct > 0 ? `<div class="zt-stack-seg" style="width:${pct}%;background:${ZONE_COLORS[z]}"></div>` : '';
      }).join('');
      const legendHtml = zones.map(z => `<div class="zt-legend-item"><span class="zt-legend-dot" style="background:${ZONE_COLORS[z]}"></span>${ZONE_LABELS[z]}: ${fmt(zt.minutes[z], 0)} min</div>`).join('');

      const goalBar = (label, currentLabel, pctOfTarget, color, isCeiling) => {
        const cappedPct = Math.min(pctOfTarget ?? 0, 100);
        const overflowCls = isCeiling && (pctOfTarget ?? 0) > 100 ? ' overflow' : '';
        return `<div><div class="zt-goal-label"><span>${label}</span><b>${currentLabel}</b></div><div class="year-bar-track"><div class="year-bar-fill${overflowCls}" style="width:${cappedPct}%;background:${color}"></div></div></div>`;
      };

      const goalsHtml = `<div class="zt-goals">
        ${goalBar('Z1 (target ' + zt.z1_target_min_pct + '-' + zt.z1_target_max_pct + '%)', (zt.z1_pct ?? 0) + '%', zt.z1_vs_target_pct, ZONE_COLORS.Z1, false)}
        ${goalBar('Z2 (target ' + zt.z2_target_min + '-' + zt.z2_target_max + ' min)', fmt(zt.minutes.Z2, 0) + ' min', zt.z2_vs_target_pct, ZONE_COLORS.Z2, false)}
        ${goalBar('Grey zone Z3+Z4 (ceiling ' + zt.grey_ceiling_pct + '%)', (zt.grey_pct ?? 0) + '%', zt.grey_vs_ceiling_pct, '#ff9f40', true)}
        ${goalBar('Z5 (target ' + zt.z5_target_min_pct + '-' + zt.z5_target_max_pct + '%)', (zt.z5_pct ?? 0) + '%', zt.z5_vs_target_pct, ZONE_COLORS.Z5, false)}
      </div>`;

      const dropoutNote = zt.dropout_fallback_sessions_with_data ? `, ${zt.dropout_fallback_sessions_with_data} via H10 dropout fallback` : '';
      const sessionsNote = `<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:1rem">${zt.running_sessions_with_data} run(s), ${zt.strength_sessions_with_data} strength session(s) with zone data this window${dropoutNote} · ${zt.window_start} to ${zt.window_end}</div>`;

      ztCard.innerHTML = `<div class="card-title-row"><div class="card-title">Time in zone</div>${toggleHtml}</div>${coachSectionHtml('zones')}<div class="zt-stack">${stackHtml}</div><div class="zt-legend">${legendHtml}</div>${goalsHtml}${sessionsNote}`;
    }

    ztCard.querySelectorAll('.zt-toggle button').forEach(btn => {
      btn.onclick = () => { ztWindow = btn.dataset.win; renderZoneTimeCard(); };
    });
  }
  renderZoneTimeCard();

  // ── Strength session HR / Garmin-vs-Polar comparison card ────────────────────
  const hrCard = document.createElement('div');
  hrCard.className = 'card';
  const overlay = Array.isArray(m.strength_hr_overlay) ? [...m.strength_hr_overlay].reverse() : [];
  const hrCompare = Array.isArray(m.run_hr_source_comparison) ? [...m.run_hr_source_comparison].reverse() : [];
  hrCard.innerHTML = `
    <div class="card-title">Strength session HR / Garmin vs Polar</div>
    ${coachSectionHtml('hr_comparison')}
    <div class="hr-subcard">
      <div class="hr-subcard-title">Strength session HR (Polar Loop overlay)</div>
      ${overlay.length ? `<div class="chart-wrap" style="height:160px"><canvas id="strengthHrChart"></canvas></div>` : `<p class="zt-empty">No overlapping strength-session HR data yet.</p>`}
    </div>
    <div class="hr-subcard">
      <div class="hr-subcard-title">Run HR: Garmin (H10) vs Polar (wrist continuous vs exercise entry) — same run windows</div>
      ${hrCompare.length ? `<div class="chart-wrap" style="height:160px"><canvas id="hrCompareChart"></canvas></div>` : `<p class="zt-empty">No matched run windows yet.</p>`}
    </div>
  `;
  app.appendChild(hrCard);

  // ── Activity calendar ─────────────────────────────────────────────────────────
  const calCard = document.createElement('div');
  calCard.className = 'card';
  calCard.id = 'calCard';
  app.appendChild(calCard);

  const runDatesSet = new Set(m.calendar.run_dates);
  const strengthDatesSet = new Set(m.calendar.strength_dates);
  const hikeDatesSet = new Set(m.calendar.hike_dates || []);

  function localDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

  function renderCalendar(year, month) {
    const now = new Date();
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dayLabels = ['M','T','W','T','F','S','S'];
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const todayStr = localDateStr(now);
    const runIcon = (color = '#e8ff5a') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><circle cx="10" cy="3" r="1.5" fill="${color}"/><path d="M7 5.5l1.5-2 2 1-1 2.5-2.5 1L5 11H3" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8l-2 3" stroke="${color}" stroke-width="1.2" stroke-linecap="round"/></svg>`;
    const strengthIcon = (color = '#4a9eff') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><rect x="1" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="11" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="3" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="9" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="5" y="6.5" width="4" height="2" rx="0.5" fill="${color}"/></svg>`;
    // NEW (July 2026) — hikes previously had no calendar representation at
    // all (not even fetched into any file — see fetch_activities.py's
    // is_hike() note). Simple mountain glyph, Accent2 (#ff6b35) per the
    // project's established color scheme for this kind of secondary marker.
    const hikeIcon = (color = '#ff6b35') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><path d="M1 11L5 4L7.5 8L9 6L13 11H1Z" fill="${color}" opacity="0.85"/></svg>`;
    let dayCells = '';
    for (let i = 0; i < startDow; i++) dayCells += `<div class="cal-day"></div>`;
    const calRows = [];
    let currentRow = [];
    for (let i = 0; i < startDow; i++) currentRow.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) {
      const dateStr = localDateStr(new Date(year, month, d));
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;
      const hasRun = runDatesSet.has(dateStr);
      const hasStrength = strengthDatesSet.has(dateStr);
      const hasHike = hikeDatesSet.has(dateStr);
      const hasActivity = hasRun || hasStrength || hasHike;
      const cls = ['cal-day', isToday ? 'today' : '', isFuture ? 'future' : '', hasActivity ? 'has-activity' : ''].filter(Boolean).join(' ');
      dayCells += `<div class="${cls}"><div class="cal-day-num">${d}</div>${hasActivity ? `<div class="cal-icons">${hasRun ? runIcon() : ''}${hasStrength ? strengthIcon() : ''}${hasHike ? hikeIcon() : ''}</div>` : ''}</div>`;
      currentRow.push(dateStr);
      if (currentRow.length === 7) { calRows.push([...currentRow]); currentRow = []; }
    }
    if (currentRow.length > 0) { while (currentRow.length < 7) currentRow.push(null); calRows.push([...currentRow]); }
    const streakCol = calRows.map(row => row.filter(Boolean).some(d => runDatesSet.has(d)));
    const todayRowIdx = calRows.findIndex(row => row.includes(todayStr));
    const currentStreak = m.running.current_weekly_streak ?? 0;
    const rowsHtml = calRows.map((row, ri) => { const isCurrentRow = ri === todayRowIdx; const done = streakCol[ri]; const streakCell = isCurrentRow ? `<div class="streak-week current-fire">🔥</div>` : `<div class="streak-week ${done ? 'done' : 'empty'}">${done ? '✓' : ''}</div>`; return `<div class="cal-row-wrap">${streakCell}</div>`; }).join('');
    const commentaryHtml = (m.calendar && m.calendar.commentary) ? `<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:1rem;padding-top:0.9rem;border-top:1px solid var(--border)">${escapeHtml(m.calendar.commentary)}</div>` : '';
    calCard.innerHTML = `<div class="card-title">Activity calendar</div>${coachSectionHtml('calendar')}<div class="cal-header"><div class="cal-title">${monthNames[month]} ${year}</div><div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div></div><div class="cal-with-streak"><div class="cal-grid">${dayLabels.map(l => `<div class="cal-day-label">${l}</div>`).join('')}${dayCells}</div><div class="streak-col"><div class="streak-col-spacer"></div>${rowsHtml}<div class="streak-total"><div class="streak-count">${currentStreak}</div><div class="streak-label">wks</div></div></div></div>${commentaryHtml}`;
    $('calPrev').onclick = () => { if (month === 0) renderCalendar(year - 1, 11); else renderCalendar(year, month - 1); };
    $('calNext').onclick = () => { const n = new Date(); const maxY = n.getFullYear(), maxM = n.getMonth(); if (year < maxY || (year === maxY && month < maxM)) month === 11 ? renderCalendar(year + 1, 0) : renderCalendar(year, month + 1); };
  }
  const todayForCal = new Date();
  renderCalendar(todayForCal.getFullYear(), todayForCal.getMonth());

  // ── Running section: PBs ─────────────────────────────────────────────────────
  const runHeading = document.createElement('div');
  runHeading.className = 'section-heading';
  runHeading.textContent = 'Running';
  app.appendChild(runHeading);

  const effortsCard = document.createElement('div');
  effortsCard.className = 'card';
  effortsCard.innerHTML = `<div class="card-title">Personal bests — by distance category</div>${coachSectionHtml('personal_bests')}<div class="efforts-grid">${m.pbs.map(pb => {
    let gapHtml = '';
    if (pb.lt_gap_sec !== null && pb.lt_gap_sec !== undefined && m.lt.latest) {
      const sign = pb.lt_gap_sec >= 0 ? '+' : '';
      gapHtml = `<div class="effort-sub" style="margin-top:0.2rem">Current LT: ${m.lt.latest.lt_pace}/km · Gap: ${sign}${pb.lt_gap_sec}s/km</div>`;
    }
    const paceLabel = pb.pace ? `${pb.pace} /km` : '—';
    const timeLabel = fmtDuration(pb.time);
    const distLabel = pb.dist !== null && pb.dist !== undefined ? `${fmt(pb.dist, 1)} km` : '—';
    return `<div class="effort"><div class="effort-label">${pb.label}</div><div class="effort-value">${paceLabel}</div><div class="effort-detail">${timeLabel} · ${distLabel}</div><div class="effort-sub">${escapeHtml(pb.name || (pb.pace ? '' : 'no data yet'))}</div><div class="effort-date">${pb.date ?? ''}</div>${gapHtml}</div>`;
  }).join('')}</div>`;
  app.appendChild(effortsCard);

  // ── Strength tests (new July 2026) ────────────────────────────────────────
  // Currently baseline-only (single July 4 2026 entry per exercise) — no
  // chart, since one point isn't a trend. A delta-vs-prior line appears
  // automatically the moment a second test is logged for any exercise, no
  // rebuild needed — same growth pattern as the LT/VO2max card. Grouped by
  // category (strength/power/durability) since that's how strength_tests.csv
  // itself categorizes entries.
  const strengthTests = Array.isArray(m.strength_tests) ? m.strength_tests : [];
  if (strengthTests.length) {
    const stCard = document.createElement('div');
    stCard.className = 'card';
    const byCategory = {};
    strengthTests.forEach(t => {
      const cat = t.category || 'other';
      (byCategory[cat] = byCategory[cat] || []).push(t);
    });
    const categoryLabels = { strength: 'Strength', power: 'Power', durability: 'Durability', bodyweight: 'Bodyweight', other: 'Other' };
    // FIXED (July 2026): previously a hardcoded 4-item list, which meant
    // any category value not in that list (e.g. a new "bodyweight" entry
    // in strength_tests.csv) silently vanished from this card instead of
    // rendering — contradicts strength_tests.csv's own "flat by design,
    // new exercise = new row, no schema changes ever" convention. Category
    // order is now derived from whatever's actually present in the data:
    // known categories first in a sensible reading order, anything unknown
    // appended alphabetically after — new categories just work.
    const knownCategoryOrder = ['strength', 'power', 'durability', 'bodyweight'];
    const presentCategories = Object.keys(byCategory);
    const categoryOrder = [
      ...knownCategoryOrder.filter(c => presentCategories.includes(c)),
      ...presentCategories.filter(c => !knownCategoryOrder.includes(c)).sort()
    ];
    const sectionsHtml = categoryOrder.filter(c => byCategory[c]).map(cat => `
      <div style="margin-bottom:1.25rem">
        <div style="font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);margin-bottom:0.6rem">${categoryLabels[cat] || cat}</div>
        <div class="efforts-grid">
          ${byCategory[cat].map(t => {
            const deltaHtml = (t.delta_pct !== null && t.delta_pct !== undefined)
              ? `<div class="effort-sub" style="margin-top:0.2rem;color:${t.delta_pct > 0 ? 'var(--accent)' : t.delta_pct < 0 ? 'var(--accent2)' : 'var(--text-dim)'}">${t.delta_pct > 0 ? '▲' : t.delta_pct < 0 ? '▼' : '▬'} ${Math.abs(t.delta_pct)}% vs ${t.prior_value}${t.unit} (${t.prior_date})</div>`
              : `<div class="effort-sub" style="margin-top:0.2rem;opacity:0.6">No retest yet</div>`;
            return `<div class="effort"><div class="effort-label">${escapeHtml(t.exercise)}</div><div class="effort-value">${escapeHtml(String(t.latest_value))}<small style="font-size:.6em;color:var(--text-dim)"> ${escapeHtml(t.unit)}</small></div><div class="effort-date">${t.latest_date}</div>${deltaHtml}</div>`;
          }).join('')}
        </div>
      </div>
    `).join('');
    stCard.innerHTML = `<div class="card-title">Strength tests</div>${sectionsHtml}`;
    app.appendChild(stCard);
  }

  // ── Render charts ─────────────────────────────────────────────────────────────
  requestAnimationFrame(() => {
    const monthData = ca.month_distance_km;
    const monthStrengthData = ca.month_strength_sessions;
    const maxMonthDist = Math.max(...monthData, 1);
    const maxMonthStr = Math.max(...monthStrengthData, 1);

    new Chart($('monthChart'), {
      type: 'bar',
      data: { labels: ca.month_labels, datasets: [
        { type: 'line', label: 'Distance (km)', data: monthData, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.08)', pointBackgroundColor: monthData.map((_, i) => i === ca.current_month_index ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 4, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yDist', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: monthStrengthData, backgroundColor: monthStrengthData.map((_, i) => i === ca.current_month_index ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.25)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yDist: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxMonthDist * 1.2) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxMonthStr + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yDist' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } }
    });

    const c16 = m.chart_16wk;
    const maxDist = Math.max(...c16.distance_km, 1);
    const maxSess = Math.max(...c16.strength_sessions, 1);
    const makeMonthPlugin = (id, boundaries, labels) => ({ id, afterDraw(chart) { const { ctx, chartArea, scales } = chart; ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([3,3]); ctx.font = '9px "DM Mono", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.textAlign = 'left'; boundaries.forEach((isBoundary, i) => { if (isBoundary) { const x = scales.x.getPixelForValue(i) - (scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0)) / 2; ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke(); ctx.setLineDash([]); ctx.fillText(labels[i], x + 4, chartArea.top + 10); ctx.setLineDash([3,3]); } }); ctx.restore(); } });

    new Chart($('optionAChart'), {
      type: 'bar',
      data: { labels: c16.labels, datasets: [
        { type: 'line', label: 'Distance (km)', data: c16.distance_km, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.12)', pointBackgroundColor: c16.distance_km.map((_, i) => i === c16.distance_km.length-1 ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 3, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yRun', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: c16.strength_sessions, backgroundColor: c16.strength_sessions.map((_, i) => i === c16.strength_sessions.length-1 ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.3)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yRun: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxDist * 1.15) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxSess + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yRun' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } },
      plugins: [makeMonthPlugin('optionAMonthLines', c16.month_boundaries, c16.month_labels)]
    });

    if ($('ltVo2Chart')) {
      const ltLabels = (m.lt.trend && m.lt.trend.labels) || [];
      const ltPaceData = (m.lt.trend && m.lt.trend.pace_sec) || [];
      const vo2Labels = (fm && fm.trend && fm.trend.labels) || [];
      const vo2Data = (fm && fm.trend && fm.trend.vo2max) || [];
      // Union of both series' dates (each is already chronologically
      // sorted MM-DD from the backend) — each dataset supplies null for
      // dates it has no reading on, so Chart.js draws a real gap rather
      // than a false interpolation across missing data.
      const unionLabels = Array.from(new Set([...ltLabels, ...vo2Labels])).sort();
      const ltSeries = unionLabels.map(l => { const i = ltLabels.indexOf(l); return i === -1 ? null : ltPaceData[i]; });
      const vo2Series = unionLabels.map(l => { const i = vo2Labels.indexOf(l); return i === -1 ? null : vo2Data[i]; });

      new Chart($('ltVo2Chart'), {
        type: 'line',
        data: {
          labels: unionLabels,
          datasets: [
            { label: 'LT pace', data: ltSeries, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.08)', pointRadius: 4, tension: 0.3, fill: false, yAxisID: 'yLT', spanGaps: false },
            { label: 'VO2max', data: vo2Series, borderColor: 'rgba(74,158,255,0.9)', backgroundColor: 'rgba(74,158,255,0.08)', pointRadius: 4, tension: 0.3, fill: false, yAxisID: 'yVO2', spanGaps: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false }, ticks: { color: '#6b6b78' } },
            yLT: { type: 'linear', position: 'left', reverse: true, grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => secToPace(v) } },
            yVO2: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff' } }
          },
          plugins: {
            legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } },
            tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yLT' ? ` LT pace: ${secToPace(ctx.parsed.y)} /km` : ` VO2max: ${ctx.parsed.y}` } }
          }
        }
      });
    }

    if ($('strengthHrChart') && overlay.length) {
      new Chart($('strengthHrChart'), {
        type: 'line',
        data: {
          labels: overlay.map(o => o.date.slice(5)),
          datasets: [
            { label: 'Avg HR', data: overlay.map(o => o.avg_hr), borderColor: 'rgba(74,158,255,0.9)', backgroundColor: 'rgba(74,158,255,0.1)', pointRadius: 3, borderWidth: 2, tension: 0.3, fill: true },
            { label: 'Max HR', data: overlay.map(o => o.max_hr), borderColor: 'rgba(255,107,53,0.7)', borderWidth: 1.5, borderDash: [4,3], pointRadius: 2, fill: false, tension: 0.3 }
          ]
        },
        options: { ...chartOpts(), plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} bpm (${overlay[ctx.dataIndex].name}, ${overlay[ctx.dataIndex].sample_count} samples)` } } } }
      });
    }

    if ($('hrCompareChart') && hrCompare.length) {
      const hasExerciseData = hrCompare.some(c => c.polar_exercise_avg_hr !== null && c.polar_exercise_avg_hr !== undefined);
      new Chart($('hrCompareChart'), {
        type: 'line',
        data: {
          labels: hrCompare.map(c => c.date.slice(5)),
          datasets: [
            { label: 'Garmin (H10)', data: hrCompare.map(c => c.garmin_avg_hr), borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.08)', pointRadius: 3, borderWidth: 2, tension: 0.3, fill: false },
            { label: 'Polar (wrist, continuous)', data: hrCompare.map(c => c.polar_avg_hr), borderColor: 'rgba(244,114,182,0.9)', backgroundColor: 'rgba(244,114,182,0.08)', pointRadius: 3, borderWidth: 2, tension: 0.3, fill: false },
            ...(hasExerciseData ? [{ label: 'Polar (exercise entry)', data: hrCompare.map(c => c.polar_exercise_avg_hr), borderColor: 'rgba(74,222,128,0.9)', backgroundColor: 'rgba(74,222,128,0.08)', pointRadius: 3, borderWidth: 2, borderDash: [3,2], tension: 0.3, fill: false }] : [])
          ]
        },
        options: { ...chartOpts(), plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ctx.parsed.y === null ? undefined : ` ${ctx.dataset.label}: ${ctx.parsed.y} bpm` } } } }
      });
      // Diagnostic note — answers the athlete's own two open questions
      // directly on the dashboard rather than only in a data file: how
      // many matched runs have exercise-entry data vs continuous-only.
      const exerciseCount = hrCompare.filter(c => c.polar_exercise_avg_hr !== null && c.polar_exercise_avg_hr !== undefined).length;
      const continuousOnlyCount = hrCompare.filter(c => (c.polar_avg_hr !== null && c.polar_avg_hr !== undefined) && (c.polar_exercise_avg_hr === null || c.polar_exercise_avg_hr === undefined)).length;
      const exerciseOnlyCount = hrCompare.filter(c => (c.polar_exercise_avg_hr !== null && c.polar_exercise_avg_hr !== undefined) && (c.polar_avg_hr === null || c.polar_avg_hr === undefined)).length;
      const noteEl = document.createElement('div');
      noteEl.style.cssText = 'font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:0.5rem';
      noteEl.textContent = `${exerciseCount} run(s) with exercise-entry HR · ${continuousOnlyCount} continuous-only · ${exerciseOnlyCount} exercise-only (diagnostic — no fallback logic applied yet)`;
      $('hrCompareChart').closest('.hr-subcard').appendChild(noteEl);
    }
  });
}

init().catch(err => { document.getElementById('app').innerHTML = `<div class="loading">Dashboard failed to render (data loaded, but something broke while building the page).<br><small>${err.message}</small></div>`; });
</script>
</body>
</html>
