<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred's Feats</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:        #0d0d0f;
      --surface:   #141417;
      --border:    #1f1f24;
      --muted:     #3a3a42;
      --text-dim:  #6b6b78;
      --text:      #c8c8d4;
      --text-hi:   #eeeef4;
      --accent:    #e8ff5a;
      --accent2:   #ff6b35;
      --strength:  #4a9eff;
      --steps:     #f472b6;
      --intensity: #a78bfa;
      --recovery:  #fbbf24;
      --font-display: 'Syne', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.6; min-height: 100vh; }
    header { border-bottom: 1px solid var(--border); padding: 2rem 2rem 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: var(--text-hi); letter-spacing: -0.03em; line-height: 1; }
    .logo span { color: var(--accent); }
    .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .cal-with-streak { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-hi); }
    .cal-nav { display: flex; gap: 0.5rem; }
    .cal-nav button { background: var(--border); border: none; color: var(--text-dim); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:hover { background: var(--muted); color: var(--text-hi); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-align: center; padding: 2px 0 4px; text-transform: uppercase; }
    .cal-day { height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; min-width: 0; gap: 1px; }
    .cal-day-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); line-height: 1; }
    .cal-day.today { background: var(--border); }
    .cal-day.today .cal-day-num { color: var(--text-hi); }
    .cal-day.future .cal-day-num { color: var(--muted); opacity: 0.35; }
    .cal-day.has-activity { background: rgba(255,255,255,0.03); }
    .cal-icons { display: flex; gap: 1px; align-items: center; justify-content: center; }
    .cal-icon { width: 11px; height: 11px; }
    .streak-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .streak-col-spacer { height: 20px; }
    .cal-row-wrap { height: 36px; display: flex; align-items: center; justify-content: center; }
    .streak-week { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-family: var(--font-mono); font-size: 10px; }
    .streak-week.done { background: var(--accent2); color: white; }
    .streak-week.empty { background: var(--border); color: var(--muted); }
    .streak-week.current-fire { font-size: 15px; background: transparent; }
    .streak-total { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
    .streak-count { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent2); line-height: 1; }
    .streak-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    main { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; gap: 1.5rem; }
    .overview-block { border: 1px solid var(--border); background: var(--border); display: flex; flex-direction: column; gap: 1px; }
    .overview-full { background: var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
    .coach-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .coach-header { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.5rem; }
    .coach-headline { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--text-hi); line-height: 1.35; margin: 0.1rem 0 0.3rem; }
    .coach-confidence { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.4rem; }
    .coach-confidence-bar { width: 40px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
    .coach-confidence-fill { height: 100%; border-radius: 2px; }
    .coach-confidence-attention { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-bottom: 0.6rem; }
    .coach-watch { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-watch-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .coach-watch-item { font-family: var(--font-body); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; padding-left: 1.1rem; position: relative; }
    .coach-watch-item + .coach-watch-item { margin-top: 0.35rem; }
    .coach-watch-item::before { content: '◦'; position: absolute; left: 0; color: var(--recovery); font-family: var(--font-mono); }
    .coach-evidence { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-evidence-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .coach-evidence-item { font-family: var(--font-mono); font-size: 11.5px; color: var(--text); line-height: 1.6; }
    .coach-evidence-item + .coach-evidence-item { margin-top: 0.3rem; }
    .coach-evidence-item.priority-low { color: var(--text-dim); opacity: 0.75; }
    .coach-digest { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-digest-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .coach-digest-item { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); line-height: 1.7; }
    .coach-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .coach-insight { font-family: var(--font-body); font-size: 13.5px; color: var(--text); line-height: 1.65; padding-left: 1.1rem; position: relative; }
    .coach-insight + .coach-insight { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-insight::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-family: var(--font-mono); }
    .coach-updated { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.25rem; }
    .coach-usage { font-family: var(--font-mono); font-size: 9px; color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.03em; }
    .overview-label { grid-column: 1 / -1; background: var(--surface); font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.5rem 1.5rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }
    .overview-label.run { color: var(--accent); }
    .overview-label.lift { color: var(--strength); }
    .overview-label.steps { color: var(--steps); }
    .overview-label.intensity { color: var(--intensity); }
    .overview-label.recovery { color: var(--recovery); }
    .stat { background: var(--surface); padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .stat-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .stat-value { font-family: var(--font-display); font-size: clamp(1.3rem, 2.5vw, 1.9rem); font-weight: 700; color: var(--text-hi); line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.blue { color: var(--strength); }
    .stat-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .section-heading { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.75rem; margin-top: 0.25rem; }
    .section-heading::before { content: ''; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; }
    .card-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .efforts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--border); }
    .effort { background: var(--surface); padding: 1rem 1.25rem; }
    .effort-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.3rem; }
    .effort-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .effort-detail { font-family: var(--font-mono); font-size: 10px; color: var(--text); margin-top: 0.25rem; }
    .effort-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 0.15rem; line-height: 1.5; }
    .effort-date { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.1rem; }
    .lt-grid { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: start; }
    .lt-values { display: flex; flex-direction: column; gap: 0.75rem; }
    .lt-main { display: flex; flex-direction: column; gap: 0.1rem; }
    .lt-pace { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .lt-hr { font-family: var(--font-mono); font-size: 13px; color: var(--accent2); }
    .lt-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .zones { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .zone { display: grid; grid-template-columns: 70px 1fr 95px 95px; align-items: center; gap: 0.6rem; font-family: var(--font-mono); font-size: 11px; }
    .zone-name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .zone-bar-track { height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
    .zone-bar-fill { height: 100%; border-radius: 2px; }
    .zone-pace { color: var(--text); white-space: nowrap; text-align: right; }
    .zone-hr { color: var(--text-dim); white-space: nowrap; text-align: right; }
    .chart-wrap { position: relative; height: 220px; }
    .year-bar-track { height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
    .year-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s ease; }
    .year-bar-fill.overflow { background: var(--accent2); }
    .year-bar-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
    .loading { text-align: center; padding: 4rem 2rem; font-family: var(--font-mono); color: var(--text-dim); font-size: 12px; letter-spacing: 0.1em; }
    .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
    .ztime-stack { display: flex; height: 28px; border-radius: 4px; overflow: hidden; background: var(--border); }
    .ztime-seg { height: 100%; min-width: 0; }
    .ztime-legend { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.75rem; }
    .ztime-legend-row { display: grid; grid-template-columns: 16px 1fr auto auto; align-items: center; gap: 0.6rem; font-family: var(--font-mono); font-size: 11px; }
    .ztime-dot { width: 10px; height: 10px; border-radius: 2px; }
    .ztime-name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .ztime-mins { color: var(--text); text-align: right; }
    .ztime-pct { color: var(--text-dim); text-align: right; min-width: 40px; }
    .ztime-callout { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); line-height: 1.7; }
    .ztime-callout strong { color: var(--text-hi); font-weight: 500; }
    .hr-source-item { font-family: var(--font-mono); font-size: 11.5px; color: var(--text); padding: 0.5rem 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .hr-source-item:last-child { border-bottom: none; }
    .hr-source-date { color: var(--text-dim); min-width: 70px; }
    .hr-source-vals { text-align: right; color: var(--text-dim); font-size: 10.5px; }
    .zgoal-section { margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--border); }
    .zgoal-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.6rem; }
    .zgoal-row { margin-bottom: 0.6rem; }
    .zgoal-label-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 0.25rem; }
    .zgoal-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .zgoal-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:0.9rem">
    <svg width="38" height="38" viewBox="0 0 38 38" style="flex-shrink:0">
      <path d="M4 30 L16 12 L22 20 L34 4" stroke="#e8ff5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="34" cy="4" r="3.5" fill="#e8ff5a"/>
      <path d="M4 34 L14 20 L20 27 L30 14" stroke="#eeeef4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
    </svg>
    <div class="logo">FRED'S <span>FEATS</span></div>
  </div>
  <div class="last-updated" id="last-updated">Loading…</div>
</header>
<main id="app">
  <div class="loading"><span class="pulse"></span>Fetching activity data…</div>
</main>
<script>
const $ = id => document.getElementById(id);

// ── Pure formatting helpers — these format Python-supplied numbers, they
// don't derive/aggregate anything themselves. ─────────────────────────────────
function fmt(n, dec = 1) { if (n === null || n === undefined || n === '') return '—'; return Number(n).toFixed(dec); }
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function secToPace(s) { if (s === null || s === undefined || s <= 0 || !isFinite(s)) return '—'; const total = Math.round(s); return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`; }
function fmtHrs(mins) { if (!mins || mins <= 0) return '—'; const h = Math.floor(mins / 60); const m = Math.round(mins % 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function fmtDuration(timeStr) { if (!timeStr) return '—'; const parts = timeStr.split(':').map(Number); if (parts.length === 3) { const [h, m, s] = parts; if (h > 0) return `${h}h ${m}m`; return `${m}m ${s}s`; } return timeStr; }
function arrowFor(qual, delta) { if (qual === 'Stable' || qual === null || qual === undefined) return '▬'; if (qual === 'Increased') return '▲'; if (qual === 'Decreased') return '▼'; return delta > 0 ? '▲' : delta < 0 ? '▼' : '▬'; }
Chart.defaults.color = '#6b6b78'; Chart.defaults.borderColor = '#1f1f24'; Chart.defaults.font.family = "'DM Mono', monospace";
function chartOpts(extra = {}) { return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10 } }, scales: { x: { grid: { color: '#1f1f24' }, ticks: { maxRotation: 0 } }, y: { grid: { color: '#1f1f24' } } }, ...extra }; }

async function init() {
  const fileStatus = {};
  const safeFetch = (name, url) =>
    fetch(url)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => { fileStatus[name] = 'ok'; return data; })
      .catch(e => { fileStatus[name] = `failed: ${e.message}`; return null; });

  const [m, coachData] = await Promise.all([
    safeFetch('metrics', 'dashboard_metrics.json'),
    safeFetch('coach', 'coach_summary.json')
  ]);

  if (!m) {
    const statusLines = Object.entries(fileStatus).map(([name, status]) => `${name}: ${status}`).join('<br>');
    document.getElementById('app').innerHTML = `<div class="loading">Failed to load core data (dashboard_metrics.json).<br><small>${statusLines}</small></div>`;
    return;
  }

  $('last-updated').textContent = `Updated ${m.last_updated}`;
  const app = $('app');
  app.innerHTML = '';

  // ── Coach card ────────────────────────────────────────────────────────────────
  if (coachData && (coachData.summary || (coachData.insights && coachData.insights.length > 0))) {
    const coachCard = document.createElement('div');
    coachCard.className = 'coach-card';
    const rawText = coachData.summary || coachData.insights.join('\n\n');
    const paragraphs = rawText.split(/\n\n+/).map(p => p.trim()).filter(Boolean);
    const parasHtml = paragraphs.map(p => `<div class="coach-insight">${escapeHtml(p)}</div>`).join('');
    const headlineHtml = coachData.headline ? `<div class="coach-headline">${escapeHtml(coachData.headline)}</div>` : '';
    const confidenceHtml = (coachData.confidence_pct !== undefined && coachData.confidence_pct !== null) ? (() => {
      const pct = coachData.confidence_pct;
      const label = coachData.confidence_label || '';
      const reasons = Array.isArray(coachData.confidence_reasons) ? coachData.confidence_reasons.join(' · ') : '';
      const attention = coachData.confidence_attention || '';
      const barColor = pct >= 85 ? '#7bc67e' : pct >= 65 ? '#e8ff5a' : '#ff9f40';
      const attentionHtml = attention ? `<div class="coach-confidence-attention">${escapeHtml(attention)}</div>` : '';
      return `<div class="coach-confidence" title="${escapeHtml(reasons)}"><div class="coach-confidence-bar"><div class="coach-confidence-fill" style="width:${pct}%;background:${barColor}"></div></div><span>${pct}% · ${escapeHtml(label)}</span></div>${attentionHtml}`;
    })() : '';
    const evidenceItems = Array.isArray(coachData.evidence_items) ? coachData.evidence_items.filter(Boolean) : [];
    const evidenceHtml = evidenceItems.length ? `<div class="coach-evidence"><div class="coach-evidence-title">Evidence supporting today's assessment</div>${evidenceItems.map(e => {
      const text = typeof e === 'string' ? e : e.text;
      const priority = typeof e === 'string' ? 'Medium' : (e.priority || 'Medium');
      const cls = priority === 'Low' ? ' priority-low' : '';
      const style = priority === 'High' ? ' style="color:var(--text-hi);font-weight:500"' : '';
      return `<div class="coach-evidence-item${cls}"${style}>${escapeHtml(text)}</div>`;
    }).join('')}</div>` : '';
    const watchItems = Array.isArray(coachData.watch_items) ? coachData.watch_items.filter(Boolean) : [];
    const watchHtml = watchItems.length ? `<div class="coach-watch"><div class="coach-watch-title">Things to watch</div>${watchItems.map(w => `<div class="coach-watch-item">${escapeHtml(w)}</div>`).join('')}</div>` : '';

    const digestHtml = (Array.isArray(m.digest) && m.digest.length) ? `<div class="coach-digest"><div class="coach-digest-title">What's changed this block</div>${m.digest.map(l => `<div class="coach-digest-item">${escapeHtml(l)}</div>`).join('')}</div>` : '';

    function usageColor(usd) { if (usd < 0.004) return '#4a9eff'; if (usd < 0.008) return '#7bc67e'; if (usd < 0.015) return '#e8ff5a'; if (usd < 0.025) return '#ff9f40'; return '#ff6b35'; }
    function mtdColor(usd) { if (usd < 0.10) return '#4a9eff'; if (usd < 0.25) return '#7bc67e'; if (usd < 0.35) return '#e8ff5a'; if (usd < 0.42) return '#ff9f40'; return '#ff6b35'; }
    function ytdColor(usd) { if (usd < 1.00) return '#4a9eff'; if (usd < 2.50) return '#7bc67e'; if (usd < 3.50) return '#e8ff5a'; if (usd < 4.50) return '#ff9f40'; return '#ff6b35'; }
    const u = coachData.usage;
    const usageHtml = u ? (() => { const dc = usageColor(u.cost_usd); const mc = mtdColor(coachData.usage_mtd_usd || 0); const yc = ytdColor(coachData.usage_ytd_usd || 0); return `<div class="coach-usage"><div><span style="color:${dc}">${u.input_tokens.toLocaleString()} it · ${u.output_tokens.toLocaleString()} ot · $${u.cost_usd.toFixed(4)} / ${u.cost_dkk.toFixed(3)} kr</span></div><div><span style="color:${mc}">MTD $${(coachData.usage_mtd_usd || 0).toFixed(4)} / ${(coachData.usage_mtd_dkk || 0).toFixed(3)} kr</span></div><div><span style="color:${yc}">YTD $${(coachData.usage_ytd_usd || 0).toFixed(4)} / ${(coachData.usage_ytd_dkk || 0).toFixed(3)} kr</span></div><div class="coach-usage-scale"><div style="background:linear-gradient(to right,#4a9eff,#7bc67e,#e8ff5a,#ff9f40,#ff6b35);height:2px;border-radius:1px;margin-top:4px;opacity:0.5"></div><div style="display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:2px"><span>min</span><span>normal</span><span>elevated</span><span>high</span><span>max</span></div></div></div>`; })() : '';
    coachCard.innerHTML = `<div class="coach-header"><span class="coach-dot"></span>Training status</div>${headlineHtml}${confidenceHtml}<button id="coachExpandBtn" style="background:none;border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:10px;padding:0.35rem 0.7rem;border-radius:4px;cursor:pointer;margin:0.3rem 0 0.6rem">Show details ▾</button><div id="coachDetails" style="display:none">${parasHtml}${evidenceHtml}${watchHtml}${digestHtml}<div class="coach-updated">Generated ${coachData.last_updated}</div>${usageHtml}</div>`;
    const coachExpandBtn = coachCard.querySelector('#coachExpandBtn');
    const coachDetails = coachCard.querySelector('#coachDetails');
    coachExpandBtn.onclick = () => {
      const isHidden = coachDetails.style.display === 'none';
      coachDetails.style.display = isHidden ? 'block' : 'none';
      coachExpandBtn.textContent = isHidden ? 'Hide details ▴' : 'Show details ▾';
    };
    app.appendChild(coachCard);
  }

  // ── Overview block ────────────────────────────────────────────────────────────
  // changeLine() replaces the previous deltaBadge()+qualLine() pair, which
  // said the same thing twice in two formats (e.g. "▲2 vs last wk" followed
  // immediately by "Increased vs last week") — now a single clear sentence,
  // on its own line, self-explanatory without needing the value above it.
  const changeLine = (delta, qual, formatFn, compareLabel) => {
    if (delta === null || delta === undefined) return '';
    if (delta === 0 || qual === 'Stable') {
      return `<br><span style="color:var(--text-dim)">Stable — no meaningful change vs ${compareLabel}</span>`;
    }
    const arrow = arrowFor(qual, delta);
    const verb = qual === 'Decreased' ? 'Decreased' : 'Increased';
    return `<br><span style="color:var(--text-dim)">${arrow} ${verb} ${formatFn(Math.abs(delta))} vs ${compareLabel}</span>`;
  };

  const r = m.running, st = m.strength, sp = m.steps, iv = m.intensity, rc = m.recovery;

  const runChangeHtml = changeLine(r.week_delta_km, r.week_qual, v => `${v.toFixed(1)} km`, 'last week');
  const strengthChangeHtml = changeLine(st.week_delta_sessions, st.week_qual, v => `${Math.round(v)} session${Math.round(v) === 1 ? '' : 's'}`, 'last week');
  const stepsChangeHtml = sp.avg_7d !== null ? changeLine(sp.delta_7d_vs_30d, sp.qual, v => `${Math.round(v).toLocaleString()} steps`, '30d average') : '';
  const stepsDiscrepancyHtml = sp.discrepancy_avg !== null ? `<br><span style="color:var(--text-dim)">Polar vs iPhone differ by ±${sp.discrepancy_avg.toLocaleString()} steps/day on average (${sp.discrepancy_days} overlapping days)</span>` : '';
  const intensityChangeHtml = changeLine(iv.delta_month_vs_year, iv.qual, v => fmtHrs(v), 'year average');
  const recoveryChangeHtml = changeLine(rc.delta_week_vs_month, rc.qual, v => fmtHrs(v), 'month average');

  const stepsRow = (sp.avg_all_time !== null) ? `<div class="overview-full"><div class="overview-label intensity" style="grid-column:1/-1;color:var(--steps)">Steps</div><div class="stat"><span class="stat-label">Avg / day (all time)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_all_time?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps</span></div><div class="stat"><span class="stat-label">Avg / day (7d)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_7d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps${stepsChangeHtml}</span></div><div class="stat"><span class="stat-label">Avg / day (30d)</span><span class="stat-value" style="color:var(--steps)">${sp.avg_30d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps${stepsDiscrepancyHtml}</span></div></div>` : '';

  const recoveryTile = (label, data, changeHtml) => {
    const durationStr = data && data.mins ? fmtHrs(data.mins) : '—';
    const scoreStr = data && data.score !== null && data.score !== undefined ? `Recovery score: ${Math.round(data.score)}` : 'Recovery score: —';
    return `<div class="stat"><span class="stat-label">${label}</span><span class="stat-value" style="color:var(--recovery)">${durationStr}</span><span class="stat-sub">${scoreStr}${changeHtml || ''}</span></div>`;
  };
  const recoveryRow = (rc.week.mins !== null || rc.month.mins !== null || rc.year.mins !== null) ? `<div class="overview-full"><div class="overview-label recovery" style="grid-column:1/-1">Recovery</div>${recoveryTile('Avg / week', rc.week, recoveryChangeHtml)}${recoveryTile('Avg / month', rc.month)}${recoveryTile('Avg / year', rc.year)}</div>` : '';

  // Freshness indicator — one light for the whole overview panel, not
  // per-tile (the underlying fetch either succeeded today or it didn't,
  // for all of these tiles at once, since they all come from the same
  // daily pipeline run).
  const freshness = m.data_freshness || {};
  const freshMap = {
    fresh: { color: '#7bc67e', label: 'Updated today' },
    stale: { color: '#e8ff5a', label: `Last updated ${freshness.age_days}d ago` },
    failed: { color: '#ff6b35', label: freshness.last_success_date ? `Fetch stale (${freshness.age_days}d) — check pipeline` : 'No successful fetch found — check pipeline' }
  };
  const freshInfo = freshMap[freshness.status] || freshMap.failed;
  const freshnessHtml = `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1.5rem;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);border-bottom:1px solid var(--border)"><div style="width:8px;height:8px;border-radius:50%;background:${freshInfo.color};flex-shrink:0"></div>${freshInfo.label}</div>`;

  const overviewBlock = document.createElement('div');
  overviewBlock.className = 'overview-block';
  overviewBlock.innerHTML = `
    ${freshnessHtml}
    <div class="overview-full">
      <div class="overview-label run" style="grid-column:1/-1">Running</div>
      <div class="stat"><span class="stat-label">Avg / run</span><span class="stat-value accent">${fmt(r.avg_per_run_km, 1)} <small style="font-size:.9rem;color:var(--text-dim)">km</small></span><span class="stat-sub">${r.runs_this_year} runs ${m.this_year}</span></div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(r.avg_per_week_km, 1)} <small style="font-size:.9rem;color:var(--text-dim)">km</small></span><span class="stat-sub">${fmt(r.total_distance_this_year_km, 0)} km ${m.this_year} · ${fmt(r.avg_runs_per_week, 1)} runs/wk avg${runChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value accent">${r.current_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${r.longest_weekly_streak ?? '—'} wks</span></div>
    </div>
    <div class="overview-full">
      <div class="overview-label lift" style="grid-column:1/-1">Strength</div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value blue">${fmt(st.avg_sessions_per_week, 1)} <small style="font-size:.9rem;color:var(--text-dim)">sessions</small></span><span class="stat-sub">${st.sessions_this_year} sessions ${m.this_year}${strengthChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(st.avg_hours_per_week, 1)} <small style="font-size:.9rem;color:var(--text-dim)">hrs</small></span><span class="stat-sub">${fmt(st.total_hours_this_year, 1)} hrs ${m.this_year}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value blue">${st.current_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${st.longest_weekly_streak ?? '—'} wks</span></div>
    </div>
    ${stepsRow}
    <div class="overview-full">
      <div class="overview-label intensity" style="grid-column:1/-1">Intensity Minutes</div>
      <div class="stat"><span class="stat-label">Avg / week (${m.this_year})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(iv.avg_week_year_mins)}</span><span class="stat-sub">${fmtHrs(iv.avg_week_year_run_mins)} run · ${fmtHrs(iv.avg_week_year_lift_mins)} lift</span></div>
      <div class="stat"><span class="stat-label">Avg / week (${m.this_month_short})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(iv.avg_week_month_mins)}</span><span class="stat-sub">${fmtHrs(iv.avg_week_month_run_mins)} run · ${fmtHrs(iv.avg_week_month_lift_mins)} lift${intensityChangeHtml}</span></div>
      <div class="stat"><span class="stat-label">Streak vs ${iv.goal_mins}min goal</span><span class="stat-value" style="color:var(--intensity)">${iv.streak_weeks} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${iv.best_streak_weeks} wks</span></div>
    </div>
    ${recoveryRow}
  `;
  app.appendChild(overviewBlock);

  // ── 16-week chart card ────────────────────────────────────────────────────────
  const comparisonGrid = document.createElement('div');
  comparisonGrid.className = 'card';
  comparisonGrid.innerHTML = `<div class="card-title">Weekly distance & strength — last 16 weeks</div><div class="chart-wrap"><canvas id="optionAChart"></canvas></div>`;
  app.appendChild(comparisonGrid);

  // ── Annual chart card ────────────────────────────────────────────────────────
  const ca = m.chart_annual;
  const grid1 = document.createElement('div');
  grid1.className = 'card';
  grid1.innerHTML = `
    <div class="card-title">Distance & strength sessions ${m.this_year}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${ca.target_label}</span>
          <span style="font-family:var(--font-display);font-size:1.4rem;color:${ca.is_overflow ? 'var(--accent2)' : 'var(--accent)'}">${fmt(ca.raw_pct, 0)}%</span>
        </div>
        <div class="year-bar-track"><div class="year-bar-fill${ca.is_overflow ? ' overflow' : ''}" style="width:${ca.display_pct}%"></div></div>
        <div class="year-bar-labels"><span>${fmt(ca.year_dist_km, 0)} km done</span><span>${ca.is_overflow ? '+' + fmt(ca.km_to_target_km, 0) + ' km ahead' : fmt(ca.km_to_target_km, 0) + ' km to go'}</span></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem">
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${ca.strength_target_label}</span>
          <span style="font-family:var(--font-display);font-size:1.4rem;color:${ca.strength_overflow ? 'var(--accent2)' : 'var(--strength)'}">${ca.strength_pct !== null ? ca.strength_pct + '%' : ca.strength_sessions_done}</span>
        </div>
        <div class="year-bar-track"><div class="year-bar-fill${ca.strength_overflow ? ' overflow' : ''}" style="width:${ca.strength_display_pct}%;background:var(--strength)"></div></div>
        <div class="year-bar-labels"><span>${ca.strength_sessions_done} sessions done</span><span>${ca.strength_sessions_to_match !== null ? (ca.strength_overflow ? '+' + Math.abs(ca.strength_sessions_to_match) + ' ahead' : ca.strength_sessions_to_match + ' to match') : ''}</span></div>
      </div>
    </div>
    <div class="chart-wrap" style="height:200px"><canvas id="monthChart"></canvas></div>
  `;
  app.appendChild(grid1);

  // ── LT card ───────────────────────────────────────────────────────────────────
  const ltCard = document.createElement('div');
  ltCard.className = 'card';
  if (m.lt.latest) {
    const zonesHtml = m.lt.zones ? m.lt.zones.map(z => `<div class="zone"><span class="zone-name">${z.name}</span><div class="zone-bar-track"><div class="zone-bar-fill" style="width:${z.pct}%;background:${z.color}"></div></div><span class="zone-pace">${z.pace_label}</span><span class="zone-hr">${z.hr_label || ''}</span></div>`).join('') : '';
    const ltTrendHtml = m.lt.trend ? `<div class="chart-wrap" style="height:100px;margin-top:1rem"><canvas id="ltChart"></canvas></div>` : `<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:1rem">Trend builds daily — check back soon.</p>`;
    ltCard.innerHTML = `<div class="card-title">Lactate threshold</div><div class="lt-grid"><div class="lt-values"><div class="lt-main"><span class="lt-label">LT pace</span><span class="lt-pace">${m.lt.latest.lt_pace} /km</span><span class="lt-hr">@ ${m.lt.latest.lt_hr} bpm · ${m.lt.latest.source_date}</span></div></div><div><div class="lt-label" style="margin-bottom:0.75rem">Training zones</div><div class="zones">${zonesHtml}</div></div></div>${ltTrendHtml}`;
  } else {
    ltCard.innerHTML = `<div class="card-title">Lactate threshold</div><p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">No valid LT reading yet — recalibrating after a data fix.</p>`;
  }
  app.appendChild(ltCard);

  // ── Zone Time / HR Sources card ────────────────────────────────────────────
  // Renders m.zone_time (Attia Zone 2 / polarized model comparison, now with
  // TWO precomputed windows — .rolling (last 7 days, default) and
  // .last_completed_week (Mon-Sun, matching the athlete's actual training
  // blocks) — toggled client-side with no rebuild needed), m.strength_hr_overlay
  // (Polar continuous HR matched to strength sessions), and
  // m.run_hr_source_comparison (Garmin/H10 vs Polar Loop for the same run
  // window). Zone colors reused from m.lt.zones so this reads as part of the
  // same system as the LT card, not a separate visual language.
  //
  // Rolling vs last-completed-week is a deliberate choice, not a gimmick to
  // toggle everywhere: rolling answers "am I on pace right now" (always a
  // full week of context, never misleadingly low mid-week); last-completed-
  // week answers "how did that finished training block actually go" (aligns
  // with the athlete's real weekly blocks and existing streak/delta logic).
  // Only zone_time has this toggle — other tiles (steps, sleep, intensity
  // averages) don't have a real target to hit, so the same distinction
  // wouldn't add anything there.
  const zoneColorMap = { Z1: '#4a9eff', Z2: '#7bc67e', Z3: '#e8ff5a', Z4: '#ff9f40', Z5: '#ff6b35' };
  const zoneLabelMap = { Z1: 'Z1 EASY', Z2: 'Z2 AEROBIC', Z3: 'Z3 TEMPO', Z4: 'Z4 LTHR', Z5: 'Z5 HARD' };

  function renderZoneTimeBody(zt) {
    const zoneOrder = ['Z1', 'Z2', 'Z3', 'Z4', 'Z5'];
    const segsHtml = zoneOrder.map(z => {
      const mins = zt.minutes[z] || 0;
      const pct = zt.total_minutes ? (mins / zt.total_minutes) * 100 : 0;
      return pct > 0 ? `<div class="ztime-seg" style="width:${pct}%;background:${zoneColorMap[z]}"></div>` : '';
    }).join('');
    const legendHtml = zoneOrder.map(z => {
      const mins = zt.minutes[z] || 0;
      const pct = zt.total_minutes ? Math.round((mins / zt.total_minutes) * 100) : 0;
      return `<div class="ztime-legend-row"><div class="ztime-dot" style="background:${zoneColorMap[z]}"></div><span class="ztime-name">${zoneLabelMap[z]}</span><span class="ztime-mins">${fmtHrs(mins)}</span><span class="ztime-pct">${pct}%</span></div>`;
    }).join('');

    if (zt.total_minutes === 0) {
      return `<div class="ztime-callout" style="border-top:none;padding-top:0;margin-top:0">No zone data for this window yet.</div>`;
    }

    // Per-zone goal bars — each shows progress toward its OWN actual target
    // number (not just "% of current activity"), reusing the same
    // year-bar-style visual language as the annual progress bars elsewhere
    // on this dashboard. Grey zone is a CEILING (bar fills as you approach
    // the limit — full/red is bad here, unlike every other bar where full
    // is good) — see PROJECT CONTEXT's RUN ZONE-TIME PROJECT section for
    // the Seiler-research sourcing of the Z1/grey/Z5 targets.
    const z2Ratio = zt.z2_vs_target_pct ?? 0;
    const z2BarPct = Math.min(z2Ratio, 100);
    const z2Color = z2Ratio >= 100 ? '#7bc67e' : z2Ratio >= 65 ? '#e8ff5a' : '#ff9f40';

    const z1Ratio = zt.z1_vs_target_pct ?? 0;
    const z1BarPct = Math.min(z1Ratio, 100);
    const z1Color = z1Ratio >= 100 ? '#7bc67e' : z1Ratio >= 70 ? '#4a9eff' : '#ff9f40';

    const greyRatio = zt.grey_vs_ceiling_pct ?? 0;
    const greyBarPct = Math.min(greyRatio, 100);
    const greyColor = greyRatio >= 100 ? '#ff6b35' : greyRatio >= 60 ? '#e8ff5a' : '#4a9eff';

    const z5Ratio = zt.z5_vs_target_pct ?? 0;
    const z5BarPct = Math.min(z5Ratio, 100);
    const z5Color = z5Ratio >= 100 ? '#7bc67e' : z5Ratio >= 50 ? '#e8ff5a' : '#ff9f40';

    const goalBarsHtml = `
      <div class="zgoal-section">
        <div class="zgoal-title">Progress toward weekly targets</div>
        <div class="zgoal-row">
          <div class="zgoal-label-row"><span>Zone 1 (easy)</span><span>${fmtHrs(zt.minutes.Z1)} of ${zt.z1_target_min_pct}-${zt.z1_target_max_pct}% target</span></div>
          <div class="zgoal-track"><div class="zgoal-fill" style="width:${z1BarPct}%;background:${z1Color}"></div></div>
        </div>
        <div class="zgoal-row">
          <div class="zgoal-label-row"><span>Zone 2 (aerobic)</span><span>${fmtHrs(zt.minutes.Z2)} of ${zt.z2_target_min}-${zt.z2_target_max} min target</span></div>
          <div class="zgoal-track"><div class="zgoal-fill" style="width:${z2BarPct}%;background:${z2Color}"></div></div>
        </div>
        <div class="zgoal-row">
          <div class="zgoal-label-row"><span>Grey zone (Z3+Z4, minimize)</span><span>${zt.grey_pct ?? 0}% of ≤${zt.grey_ceiling_pct}% ceiling</span></div>
          <div class="zgoal-track"><div class="zgoal-fill" style="width:${greyBarPct}%;background:${greyColor}"></div></div>
        </div>
        <div class="zgoal-row">
          <div class="zgoal-label-row"><span>Zone 5 (hard)</span><span>${fmtHrs(zt.minutes.Z5)} of ${zt.z5_target_min_pct}-${zt.z5_target_max_pct}% target</span></div>
          <div class="zgoal-track"><div class="zgoal-fill" style="width:${z5BarPct}%;background:${z5Color}"></div></div>
        </div>
      </div>
    `;

    return `
      <div class="ztime-stack">${segsHtml}</div>
      <div class="ztime-legend">${legendHtml}</div>
      ${goalBarsHtml}
      <div class="ztime-callout">
        <span style="opacity:0.7">${zt.window_start} to ${zt.window_end} · ${zt.running_sessions_with_data} run(s), ${zt.strength_sessions_with_data} strength session(s) contributing data</span>
      </div>
    `;
  }

  if (m.zone_time && m.zone_time.rolling && m.zone_time.rolling.has_lt_data) {
    let currentView = m.zone_time.default_view || 'rolling';
    const ztimeCard = document.createElement('div');
    ztimeCard.className = 'card';

    function renderZtimeCard() {
      const zt = currentView === 'rolling' ? m.zone_time.rolling : m.zone_time.last_completed_week;
      ztimeCard.innerHTML = `
        <div class="card-title" style="margin-bottom:0.5rem">
          Time in zone <span style="font-weight:400;opacity:0.6">(Attia Zone 2 model)</span>
        </div>
        <div style="display:flex;gap:0.4rem;margin-bottom:1rem">
          <button class="ztime-toggle-btn" data-view="rolling" style="flex:1;padding:0.4rem;border-radius:4px;border:1px solid var(--border);background:${currentView === 'rolling' ? 'var(--border)' : 'transparent'};color:${currentView === 'rolling' ? 'var(--text-hi)' : 'var(--text-dim)'};font-family:var(--font-mono);font-size:10.5px;cursor:pointer">This week (rolling 7d)</button>
          <button class="ztime-toggle-btn" data-view="last_completed_week" style="flex:1;padding:0.4rem;border-radius:4px;border:1px solid var(--border);background:${currentView === 'last_completed_week' ? 'var(--border)' : 'transparent'};color:${currentView === 'last_completed_week' ? 'var(--text-hi)' : 'var(--text-dim)'};font-family:var(--font-mono);font-size:10.5px;cursor:pointer">Last completed week</button>
        </div>
        ${renderZoneTimeBody(zt)}
      `;
      ztimeCard.querySelectorAll('.ztime-toggle-btn').forEach(btn => {
        btn.onclick = () => { currentView = btn.dataset.view; renderZtimeCard(); };
      });
    }
    renderZtimeCard();
    app.appendChild(ztimeCard);
  }

  const hasStrengthHr = Array.isArray(m.strength_hr_overlay) && m.strength_hr_overlay.length > 0;
  const hasHrComparison = Array.isArray(m.run_hr_source_comparison) && m.run_hr_source_comparison.length > 0;
  if (hasStrengthHr || hasHrComparison) {
    // Chart-based, not list-based — a growing list of rows can't show whether
    // Polar's under-read vs Garmin is consistent over time, or whether
    // strength-session effort is trending up/down across the block. A trend
    // line answers exactly that. Each chart individually falls back to a
    // "trend builds daily" message below 2 points, same pattern as the LT
    // trend chart — a single point can't show a trend either way.
    const hrTrendCard = document.createElement('div');
    hrTrendCard.className = 'card';
    const comparisonChartHtml = hasHrComparison ? `
      <div class="card-title" style="margin-bottom:0.75rem">Run HR: Garmin vs Polar <span style="font-weight:400;opacity:0.6">(same run window)</span></div>
      ${m.run_hr_source_comparison.length >= 2
        ? `<div class="chart-wrap" style="height:140px"><canvas id="hrComparisonChart"></canvas></div>`
        : `<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">Trend builds daily — check back soon (${m.run_hr_source_comparison.length} day${m.run_hr_source_comparison.length === 1 ? '' : 's'} so far).</p>`}
    ` : '';
    const strengthChartHtml = hasStrengthHr ? `
      <div class="card-title" style="margin-top:${hasHrComparison ? '1.5rem' : '0'};margin-bottom:0.75rem">Strength session HR <span style="font-weight:400;opacity:0.6">(Polar Loop overlay)</span></div>
      ${m.strength_hr_overlay.length >= 2
        ? `<div class="chart-wrap" style="height:140px"><canvas id="strengthHrChart"></canvas></div>`
        : `<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">Trend builds daily — check back soon (${m.strength_hr_overlay.length} session${m.strength_hr_overlay.length === 1 ? '' : 's'} so far).</p>`}
    ` : '';
    hrTrendCard.innerHTML = comparisonChartHtml + strengthChartHtml;
    app.appendChild(hrTrendCard);
  }

  // ── Activity calendar ─────────────────────────────────────────────────────────
  const calCard = document.createElement('div');
  calCard.className = 'card';
  calCard.id = 'calCard';
  app.appendChild(calCard);

  const runDatesSet = new Set(m.calendar.run_dates);
  const strengthDatesSet = new Set(m.calendar.strength_dates);

  function localDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

  function renderCalendar(year, month) {
    const now = new Date();
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dayLabels = ['M','T','W','T','F','S','S'];
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const todayStr = localDateStr(now);
    const runIcon = (color = '#e8ff5a') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><circle cx="10" cy="3" r="1.5" fill="${color}"/><path d="M7 5.5l1.5-2 2 1-1 2.5-2.5 1L5 11H3" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8l-2 3" stroke="${color}" stroke-width="1.2" stroke-linecap="round"/></svg>`;
    const strengthIcon = (color = '#4a9eff') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><rect x="1" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="11" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="3" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="9" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="5" y="6.5" width="4" height="2" rx="0.5" fill="${color}"/></svg>`;
    let dayCells = '';
    for (let i = 0; i < startDow; i++) dayCells += `<div class="cal-day"></div>`;
    const calRows = [];
    let currentRow = [];
    for (let i = 0; i < startDow; i++) currentRow.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) {
      const dateStr = localDateStr(new Date(year, month, d));
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;
      const hasRun = runDatesSet.has(dateStr);
      const hasStrength = strengthDatesSet.has(dateStr);
      const hasActivity = hasRun || hasStrength;
      const cls = ['cal-day', isToday ? 'today' : '', isFuture ? 'future' : '', hasActivity ? 'has-activity' : ''].filter(Boolean).join(' ');
      dayCells += `<div class="${cls}"><div class="cal-day-num">${d}</div>${hasActivity ? `<div class="cal-icons">${hasRun ? runIcon() : ''}${hasStrength ? strengthIcon() : ''}</div>` : ''}</div>`;
      currentRow.push(dateStr);
      if (currentRow.length === 7) { calRows.push([...currentRow]); currentRow = []; }
    }
    if (currentRow.length > 0) { while (currentRow.length < 7) currentRow.push(null); calRows.push([...currentRow]); }
    const streakCol = calRows.map(row => row.filter(Boolean).some(d => runDatesSet.has(d)));
    const todayRowIdx = calRows.findIndex(row => row.includes(todayStr));
    const currentStreak = m.running.current_weekly_streak ?? 0;
    const rowsHtml = calRows.map((row, ri) => { const isCurrentRow = ri === todayRowIdx; const done = streakCol[ri]; const streakCell = isCurrentRow ? `<div class="streak-week current-fire">🔥</div>` : `<div class="streak-week ${done ? 'done' : 'empty'}">${done ? '✓' : ''}</div>`; return `<div class="cal-row-wrap">${streakCell}</div>`; }).join('');
    calCard.innerHTML = `<div class="card-title">Activity calendar</div><div class="cal-header"><div class="cal-title">${monthNames[month]} ${year}</div><div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div></div><div class="cal-with-streak"><div class="cal-grid">${dayLabels.map(l => `<div class="cal-day-label">${l}</div>`).join('')}${dayCells}</div><div class="streak-col"><div class="streak-col-spacer"></div>${rowsHtml}<div class="streak-total"><div class="streak-count">${currentStreak}</div><div class="streak-label">wks</div></div></div></div>${m.calendar.commentary ? `<div style="margin-top:1rem;padding-top:0.85rem;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">${escapeHtml(m.calendar.commentary)}</div>` : ''}`;
    $('calPrev').onclick = () => { if (month === 0) renderCalendar(year - 1, 11); else renderCalendar(year, month - 1); };
    $('calNext').onclick = () => { const n = new Date(); const maxY = n.getFullYear(), maxM = n.getMonth(); if (year < maxY || (year === maxY && month < maxM)) month === 11 ? renderCalendar(year + 1, 0) : renderCalendar(year, month + 1); };
  }
  const todayForCal = new Date();
  renderCalendar(todayForCal.getFullYear(), todayForCal.getMonth());

  // ── Running section: PBs ─────────────────────────────────────────────────────
  const runHeading = document.createElement('div');
  runHeading.className = 'section-heading';
  runHeading.textContent = 'Running';
  app.appendChild(runHeading);

  const effortsCard = document.createElement('div');
  effortsCard.className = 'card';
  effortsCard.innerHTML = `<div class="card-title">Personal bests — by distance category</div><div class="efforts-grid">${m.pbs.map(pb => {
    let gapHtml = '';
    if (pb.lt_gap_sec !== null && pb.lt_gap_sec !== undefined && m.lt.latest) {
      const sign = pb.lt_gap_sec >= 0 ? '+' : '';
      gapHtml = `<div class="effort-sub">Current LTHR pace: ${m.lt.latest.lt_pace}/km</div><div class="effort-sub">Gap to LTHR: ${sign}${pb.lt_gap_sec}s/km</div>`;
    }
    const paceLabel = pb.pace ? `${pb.pace} /km` : '—';
    const timeLabel = fmtDuration(pb.time);
    const distLabel = pb.dist !== null && pb.dist !== undefined ? `${fmt(pb.dist, 1)} km` : '—';
    const noDataHtml = (!pb.pace) ? `<div class="effort-sub">No data yet</div>` : '';
    return `<div class="effort"><div class="effort-label">${pb.label}</div><div class="effort-value">${paceLabel}</div><div class="effort-detail">${timeLabel} · ${distLabel}</div>${noDataHtml}<div class="effort-date">${pb.date ?? ''}</div>${gapHtml}</div>`;
  }).join('')}</div>`;
  app.appendChild(effortsCard);

  // ── Render charts ─────────────────────────────────────────────────────────────
  requestAnimationFrame(() => {
    const monthData = ca.month_distance_km;
    const monthStrengthData = ca.month_strength_sessions;
    const maxMonthDist = Math.max(...monthData, 1);
    const maxMonthStr = Math.max(...monthStrengthData, 1);

    const makeHLinePlugin = (id, yValue, label, color, yScaleId) => ({
      id,
      afterDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const scale = scales[yScaleId];
        if (!scale) return;
        const y = scale.getPixelForValue(yValue);
        if (y < chartArea.top || y > chartArea.bottom) return; // off-chart, don't draw
        ctx.save();
        ctx.strokeStyle = color;
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '9px "DM Mono", monospace';
        ctx.fillStyle = color;
        ctx.textAlign = 'right';
        ctx.fillText(label, chartArea.right - 4, y - 4);
        ctx.restore();
      }
    });
    const lastYearAvgPerMonth = ca.target_km / 12;

    new Chart($('monthChart'), {
      type: 'bar',
      data: { labels: ca.month_labels, datasets: [
        { type: 'line', label: 'Distance (km)', data: monthData, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.08)', pointBackgroundColor: monthData.map((_, i) => i === ca.current_month_index ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 4, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yDist', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: monthStrengthData, backgroundColor: monthStrengthData.map((_, i) => i === ca.current_month_index ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.25)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yDist: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxMonthDist * 1.2) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxMonthStr + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yDist' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } },
      plugins: (ca.target_km > 0) ? [makeHLinePlugin('lastYearLine', lastYearAvgPerMonth, `${ca.target_km.toFixed(0)}km last yr (${lastYearAvgPerMonth.toFixed(0)}/mo avg)`, 'rgba(255,107,53,0.6)', 'yDist')] : []
    });

    const c16 = m.chart_16wk;
    const maxDist = Math.max(...c16.distance_km, 1);
    const maxSess = Math.max(...c16.strength_sessions, 1);
    const makeMonthPlugin = (id, boundaries, labels) => ({ id, afterDraw(chart) { const { ctx, chartArea, scales } = chart; ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([3,3]); ctx.font = '9px "DM Mono", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.textAlign = 'left'; boundaries.forEach((isBoundary, i) => { if (isBoundary) { const x = scales.x.getPixelForValue(i) - (scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0)) / 2; ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke(); ctx.setLineDash([]); ctx.fillText(labels[i], x + 4, chartArea.top + 10); ctx.setLineDash([3,3]); } }); ctx.restore(); } });

    new Chart($('optionAChart'), {
      type: 'bar',
      data: { labels: c16.labels, datasets: [
        { type: 'line', label: 'Distance (km)', data: c16.distance_km, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.12)', pointBackgroundColor: c16.distance_km.map((_, i) => i === c16.distance_km.length-1 ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 3, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yRun', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: c16.strength_sessions, backgroundColor: c16.strength_sessions.map((_, i) => i === c16.strength_sessions.length-1 ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.3)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yRun: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxDist * 1.15) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxSess + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yRun' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } },
      plugins: [makeMonthPlugin('optionAMonthLines', c16.month_boundaries, c16.month_labels)]
    });

    if ($('ltChart') && m.lt.trend) {
      const t = m.lt.trend;
      new Chart($('ltChart'), { type: 'line', data: { labels: t.labels, datasets: [ { data: t.pace_sec, borderColor: 'rgba(232,255,90,0.8)', backgroundColor: 'rgba(232,255,90,0.06)', pointBackgroundColor: 'rgba(232,255,90,0.9)', pointRadius: 4, tension: 0.3, fill: true }, { data: t.trend_sec, borderColor: 'rgba(255,107,53,0.7)', borderWidth: 1.5, borderDash: [4,3], pointRadius: 0, fill: false, tension: 0 } ] }, options: { ...chartOpts(), scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, y: { reverse: true, grid: { color: '#1f1f24' }, ticks: { color: '#6b6b78', callback: v => secToPace(v) } } }, plugins: { ...chartOpts().plugins, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ctx.datasetIndex === 0 ? ` LT pace: ${secToPace(ctx.parsed.y)} /km` : ` Trend` } } } } });
    }

    if ($('hrComparisonChart') && m.run_hr_source_comparison && m.run_hr_source_comparison.length >= 2) {
      // Chronological order for a trend line — run_hr_source_comparison is
      // stored newest-first (matching every other list in this dashboard),
      // so reverse for charting.
      const hrc = [...m.run_hr_source_comparison].reverse();
      new Chart($('hrComparisonChart'), {
        type: 'line',
        data: {
          labels: hrc.map(c => c.date.slice(5)),
          datasets: [
            { label: 'Garmin', data: hrc.map(c => c.garmin_avg_hr), borderColor: 'rgba(232,255,90,0.85)', backgroundColor: 'rgba(232,255,90,0.06)', pointRadius: 3, tension: 0.3, fill: false },
            { label: 'Polar', data: hrc.map(c => c.polar_avg_hr), borderColor: 'rgba(74,158,255,0.85)', backgroundColor: 'rgba(74,158,255,0.06)', pointRadius: 3, tension: 0.3, fill: false }
          ]
        },
        options: { ...chartOpts(), plugins: { ...chartOpts().plugins, legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} bpm` } } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, y: { grid: { color: '#1f1f24' }, ticks: { color: '#6b6b78', callback: v => `${v} bpm` } } } }
      });
    }

    if ($('strengthHrChart') && m.strength_hr_overlay && m.strength_hr_overlay.length >= 2) {
      const shr = [...m.strength_hr_overlay].reverse();
      new Chart($('strengthHrChart'), {
        type: 'line',
        data: {
          labels: shr.map(s => s.date.slice(5)),
          datasets: [
            { label: 'Avg HR', data: shr.map(s => s.avg_hr), borderColor: 'rgba(74,158,255,0.85)', backgroundColor: 'rgba(74,158,255,0.08)', pointRadius: 3, tension: 0.3, fill: true },
            { label: 'Max HR', data: shr.map(s => s.max_hr), borderColor: 'rgba(255,107,53,0.6)', borderWidth: 1.5, borderDash: [4, 3], pointRadius: 2, tension: 0.3, fill: false }
          ]
        },
        options: { ...chartOpts(), plugins: { ...chartOpts().plugins, legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y} bpm` } } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, y: { grid: { color: '#1f1f24' }, ticks: { color: '#6b6b78', callback: v => `${v} bpm` } } } }
      });
    }
  });
}

init().catch(err => { document.getElementById('app').innerHTML = `<div class="loading">Dashboard failed to render (data loaded, but something broke while building the page).<br><small>${err.message}</small></div>`; });
</script>
</body>
</html>
