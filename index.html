<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fred's Feats</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:        #0d0d0f;
      --surface:   #141417;
      --border:    #1f1f24;
      --muted:     #3a3a42;
      --text-dim:  #6b6b78;
      --text:      #c8c8d4;
      --text-hi:   #eeeef4;
      --accent:    #e8ff5a;
      --accent2:   #ff6b35;
      --strength:  #4a9eff;
      --steps:     #f472b6;
      --intensity: #a78bfa;
      --recovery:  #fbbf24;
      --font-display: 'Syne', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.6; min-height: 100vh; }
    header { border-bottom: 1px solid var(--border); padding: 2rem 2rem 1.5rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: var(--text-hi); letter-spacing: -0.03em; line-height: 1; }
    .logo span { color: var(--accent); }
    .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .cal-with-streak { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: start; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .cal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--text-hi); }
    .cal-nav { display: flex; gap: 0.5rem; }
    .cal-nav button { background: var(--border); border: none; color: var(--text-dim); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .cal-nav button:hover { background: var(--muted); color: var(--text-hi); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-align: center; padding: 2px 0 4px; text-transform: uppercase; }
    .cal-day { height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; min-width: 0; gap: 1px; }
    .cal-day-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); line-height: 1; }
    .cal-day.today { background: var(--border); }
    .cal-day.today .cal-day-num { color: var(--text-hi); }
    .cal-day.future .cal-day-num { color: var(--muted); opacity: 0.35; }
    .cal-day.has-activity { background: rgba(255,255,255,0.03); }
    .cal-icons { display: flex; gap: 1px; align-items: center; justify-content: center; }
    .cal-icon { width: 11px; height: 11px; }
    .streak-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .streak-col-spacer { height: 20px; }
    .cal-row-wrap { height: 36px; display: flex; align-items: center; justify-content: center; }
    .streak-week { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-family: var(--font-mono); font-size: 10px; }
    .streak-week.done { background: var(--accent2); color: white; }
    .streak-week.empty { background: var(--border); color: var(--muted); }
    .streak-week.current-fire { font-size: 15px; background: transparent; }
    .streak-total { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
    .streak-count { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent2); line-height: 1; }
    .streak-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    main { max-width: 1400px; margin: 0 auto; padding: 2rem; display: grid; gap: 1.5rem; }
    .overview-block { border: 1px solid var(--border); background: var(--border); display: flex; flex-direction: column; gap: 1px; }
    .overview { background: var(--border); display: grid; grid-template-columns: 1fr 1px 1fr; }
    .overview-half { background: var(--border); display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; }
    .overview-full { background: var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
    .overview-divider { background: var(--border); width: 1px; }
    .coach-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .coach-header { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.5rem; }
    .coach-headline { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--text-hi); line-height: 1.35; margin: 0.1rem 0 0.3rem; }
    .coach-watch { margin-top: 0.9rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-watch-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.5rem; }
    .coach-watch-item { font-family: var(--font-body); font-size: 12.5px; color: var(--text-dim); line-height: 1.5; padding-left: 1.1rem; position: relative; }
    .coach-watch-item + .coach-watch-item { margin-top: 0.35rem; }
    .coach-watch-item::before { content: '◦'; position: absolute; left: 0; color: var(--recovery); font-family: var(--font-mono); }
    .coach-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .coach-insight { font-family: var(--font-body); font-size: 13.5px; color: var(--text); line-height: 1.65; padding-left: 1.1rem; position: relative; }
    .coach-insight + .coach-insight { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .coach-insight::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-family: var(--font-mono); }
    .coach-updated { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.25rem; }
    .coach-usage { font-family: var(--font-mono); font-size: 9px; color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.03em; }
    .overview-label { grid-column: 1 / -1; background: var(--surface); font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.5rem 1.5rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }
    .overview-label.run { color: var(--accent); }
    .overview-label.lift { color: var(--strength); }
    .overview-label.steps { color: var(--steps); }
    .overview-label.intensity { color: var(--intensity); }
    .overview-label.recovery { color: var(--recovery); }
    @media (max-width: 800px) { .overview { grid-template-columns: 1fr; } .overview-divider { display: none; } }
    .stat { background: var(--surface); padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .stat-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .stat-value { font-family: var(--font-display); font-size: clamp(1.3rem, 2.5vw, 1.9rem); font-weight: 700; color: var(--text-hi); line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.blue { color: var(--strength); }
    .stat-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
    .section-heading { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); display: flex; align-items: center; gap: 0.75rem; margin-top: 0.25rem; }
    .section-heading::before { content: ''; width: 3px; height: 12px; background: var(--accent); border-radius: 2px; }
    .section-heading.lift::before { background: var(--strength); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 1.5rem; }
    .card-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .efforts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--border); }
    .effort { background: var(--surface); padding: 1rem 1.25rem; }
    .effort-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 0.3rem; }
    .effort-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .effort-detail { font-family: var(--font-mono); font-size: 10px; color: var(--text); margin-top: 0.25rem; }
    .effort-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .effort-date { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 0.1rem; }
    .lt-grid { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: start; }
    .lt-values { display: flex; flex-direction: column; gap: 0.75rem; }
    .lt-main { display: flex; flex-direction: column; gap: 0.1rem; }
    .lt-pace { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .lt-hr { font-family: var(--font-mono); font-size: 13px; color: var(--accent2); }
    .lt-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
    .zones { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .zone { display: grid; grid-template-columns: 70px 1fr 150px; align-items: center; gap: 0.75rem; font-family: var(--font-mono); font-size: 11px; }
    .zone-name { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    .zone-bar-track { height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
    .zone-bar-fill { height: 100%; border-radius: 2px; }
    .zone-pace { color: var(--text); white-space: nowrap; text-align: right; min-width: 170px; }
    .chart-wrap { position: relative; height: 220px; }
    .year-bar-track { height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
    .year-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s ease; }
    .year-bar-fill.overflow { background: var(--accent2); }
    .year-bar-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
    .loading { text-align: center; padding: 4rem 2rem; font-family: var(--font-mono); color: var(--text-dim); font-size: 12px; letter-spacing: 0.1em; }
    .pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
  </style>
</head>
<body>
<header>
  <div class="logo">FRED'S <span>FEATS</span></div>
  <div class="last-updated" id="last-updated">Loading…</div>
</header>
<main id="app">
  <div class="loading"><span class="pulse"></span>Fetching activity data…</div>
</main>
<script>
const $ = id => document.getElementById(id);
function fmt(n, dec = 1) { if (n === null || n === undefined || n === '') return '—'; return Number(n).toFixed(dec); }
function localDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseLocalDate(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return new Date(y, m - 1, d); }
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function isoWeek(dateStr) { const d = parseLocalDate(dateStr); d.setHours(0, 0, 0, 0); const thursday = new Date(d); thursday.setDate(d.getDate() + 4 - (d.getDay() || 7)); const isoYear = thursday.getFullYear(); const yearStart = new Date(isoYear, 0, 1); const week = Math.ceil((((thursday - yearStart) / 86400000) + 1) / 7); return `${isoYear}-W${String(week).padStart(2, '0')}`; }
function weekStartDate(isoWk) { const [y, w] = isoWk.split('-W').map(Number); const jan4 = new Date(y, 0, 4); const dayOfWeek = jan4.getDay() || 7; const week1Mon = new Date(jan4); week1Mon.setDate(jan4.getDate() - dayOfWeek + 1); const result = new Date(week1Mon); result.setDate(week1Mon.getDate() + (w - 1) * 7); return result; }
function shiftWeekKey(isoWk, weeks) { const d = weekStartDate(isoWk); d.setDate(d.getDate() + weeks * 7); return isoWeek(localDate(d)); }
function weekRange(startKey, endKey) { const weeks = []; if (!startKey || !endKey) return weeks; for (let wk = startKey, guard = 0; wk <= endKey && guard < 800; wk = shiftWeekKey(wk, 1), guard++) weeks.push(wk); return weeks; }
function paceToSec(p) { if (!p) return null; const [m, s] = p.split(':').map(Number); return m * 60 + (s || 0); }
function secToPace(s) { if (!s || s <= 0 || !isFinite(s)) return '—'; const total = Math.round(s); return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`; }
function fmtHrs(mins) { if (!mins || mins <= 0) return '—'; const h = Math.floor(mins / 60); const m = Math.round(mins % 60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
function fmtDuration(timeStr) { if (!timeStr) return '—'; const parts = timeStr.split(':').map(Number); if (parts.length === 3) { const [h, m, s] = parts; if (h > 0) return `${h}h ${m}m`; return `${m}m ${s}s`; } return timeStr; }
function linearTrend(values) { const n = values.length; if (n < 2) return values.map(() => null); const xs = values.map((_, i) => i); const validPairs = xs.map((x, i) => [x, values[i]]).filter(([,v]) => v !== null && v !== undefined && !isNaN(v)); if (validPairs.length < 2) return values.map(() => null); const xMean = validPairs.reduce((s, [x]) => s + x, 0) / validPairs.length; const yMean = validPairs.reduce((s, [,y]) => s + y, 0) / validPairs.length; let num = 0, den = 0; validPairs.forEach(([x, y]) => { num += (x - xMean) * (y - yMean); den += (x - xMean) ** 2; }); const slope = den !== 0 ? num / den : 0; const intercept = yMean - slope * xMean; return xs.map(x => slope * x + intercept); }
Chart.defaults.color = '#6b6b78'; Chart.defaults.borderColor = '#1f1f24'; Chart.defaults.font.family = "'DM Mono', monospace"; Chart.defaults.font.size = 10;
function chartOpts(extra = {}) { return { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10 } }, scales: { x: { grid: { color: '#1f1f24' }, ticks: { maxRotation: 0 } }, y: { grid: { color: '#1f1f24' } } }, ...extra }; }
function calcBestEfforts(runs) { const cats = [{ label: '5 km', min: 4 }, { label: '10 km', min: 8 }, { label: 'Half', min: 18 }, { label: 'Marathon', min: 38 }, { label: '50 km', min: 45 }]; const results = cats.map(cat => { const eligible = runs.filter(r => parseFloat(r.distance_km) >= cat.min && r.avg_pace_min_km); if (!eligible.length) return { label: cat.label, pace: '—', time: '—', dist: '—', date: null, name: 'no data yet' }; const best = eligible.reduce((a, b) => paceToSec(a.avg_pace_min_km) < paceToSec(b.avg_pace_min_km) ? a : b); return { label: cat.label, pace: best.avg_pace_min_km + ' /km', time: fmtDuration(best.moving_time), dist: fmt(best.distance_km, 1) + ' km', date: best.date, name: best.name || '' }; }); const longest = runs.reduce((a, b) => (parseFloat(a.distance_km) || 0) > (parseFloat(b.distance_km) || 0) ? a : b, runs[0]); results.push({ label: 'Longest', pace: longest?.avg_pace_min_km ? longest.avg_pace_min_km + ' /km' : '—', time: fmtDuration(longest?.moving_time), dist: fmt(longest?.distance_km, 1) + ' km', date: longest?.date, name: longest?.name || '' }); return results; }
function calcZones(ltPaceStr, ltHr) { const ltSec = paceToSec(ltPaceStr); if (!ltSec) return null; const z1HrMax = ltHr ? Math.round(ltHr * 0.80) : null; const z2HrMax = ltHr ? Math.round(ltHr * 0.90) : null; const z3HrMax = ltHr ? Math.round(ltHr * 0.99) : null; const z4HrMax = ltHr ? Math.round(ltHr * 1.05) : null; return [ { name: 'Z1 EASY', pace: `> ${secToPace(ltSec + 75)}`, hr: ltHr ? `< ${z1HrMax} bpm` : '', color: '#4a9eff', pct: 40 }, { name: 'Z2 AEROBIC', pace: `${secToPace(ltSec + 45)}–${secToPace(ltSec + 74)}`, hr: ltHr ? `${z1HrMax}–${z2HrMax} bpm` : '', color: '#7bc67e', pct: 60 }, { name: 'Z3 TEMPO', pace: `${secToPace(ltSec + 10)}–${secToPace(ltSec + 44)}`, hr: ltHr ? `${z2HrMax}–${z3HrMax} bpm` : '', color: '#e8ff5a', pct: 78 }, { name: 'Z4 LT', pace: `${secToPace(ltSec - 10)}–${secToPace(ltSec + 9)}`, hr: ltHr ? `${z3HrMax}–${z4HrMax} bpm` : '', color: '#ff9f40', pct: 90 }, { name: 'Z5 HARD', pace: `< ${secToPace(ltSec - 11)}`, hr: ltHr ? `> ${z4HrMax} bpm` : '', color: '#ff6b35', pct: 100 } ]; }

async function init() {
  const [runsRaw, strengthRaw, summary, ltDataRaw, coachData, stepsRaw, sleepRaw] = await Promise.all([
    fetch('runs.csv').then(r => r.text()),
    fetch('strength.csv').then(r => r.text()).catch(() => null),
    fetch('summary.json').then(r => r.json()).catch(() => null),
    fetch('lactate.json').then(r => r.json()).catch(() => []),
    fetch('coach_summary.json').then(r => r.json()).catch(() => null),
    fetch('steps.csv').then(r => r.text()).catch(() => null),
    fetch('sleep.csv').then(r => r.text()).catch(() => null)
  ]);

  const { data: runRows } = Papa.parse(runsRaw, { header: true, skipEmptyLines: true });
  const runs = runRows.filter(r => r.date);
  let sessions = [];
  if (strengthRaw) { const { data: sRows } = Papa.parse(strengthRaw, { header: true, skipEmptyLines: true }); sessions = sRows.filter(r => r.date); }
  const ltData = (ltDataRaw || []).filter(r => { const sec = paceToSec(r.lt_pace); return sec && sec > 90 && sec < 900; });
  if (summary) $('last-updated').textContent = `Updated ${summary.last_updated}`;

  const app = $('app');
  app.innerHTML = '';

  const today = new Date();
  const todayIso = localDate(today);
  const lastCompleteDay = new Date(today);
  lastCompleteDay.setDate(today.getDate() - 1);
  const lastCompleteDate = localDate(lastCompleteDay);
  const thisYear = today.getFullYear().toString();
  const thisMonth = today.toLocaleString('en', { month: 'short' });

  const runsComplete = runs.filter(r => r.date <= lastCompleteDate);
  const sessionsComplete = sessions.filter(s => s.date <= lastCompleteDate);
  const yearRuns = runsComplete.filter(r => r.date.startsWith(thisYear));
  const yearDist = yearRuns.reduce((s, r) => s + (parseFloat(r.distance_km) || 0), 0);
  const yearSessions = sessionsComplete.filter(s => s.date.startsWith(thisYear));
  const totalStrengthMinYear = yearSessions.reduce((s, r) => s + (parseFloat(r.duration_min) || 0), 0);
  const runWeeksYear = new Set(yearRuns.map(r => isoWeek(r.date)));
  const sWeeksYear = new Set(yearSessions.map(s => isoWeek(s.date)));
  const activityWeeksYear = new Set([...runWeeksYear, ...sWeeksYear]);
  const numRunWeeks = Math.max(runWeeksYear.size, 1);
  const numSWeeks = Math.max(sWeeksYear.size, 1);
  const numActivityWeeks = Math.max(activityWeeksYear.size, 1);
  const avgRunDistPerWeek = yearDist / numRunWeeks;
  const avgRunDistPerRun = yearDist / Math.max(yearRuns.length, 1);
  const avgSessPerWeek = yearSessions.length / numSWeeks;
  const monthRuns = yearRuns.filter(r => parseLocalDate(r.date).toLocaleString('en', { month: 'short' }) === thisMonth);
  const monthSessions = yearSessions.filter(s => parseLocalDate(s.date).toLocaleString('en', { month: 'short' }) === thisMonth);
  const monthRunWeeks = new Set(monthRuns.map(r => isoWeek(r.date)));
  const monthStrengthWeeks = new Set(monthSessions.map(s => isoWeek(s.date)));
  const monthActivityWeeks = new Set([...monthRunWeeks, ...monthStrengthWeeks]);
  const numMonthRunWeeks = Math.max(monthRunWeeks.size, 1);
  const numMonthStrengthWeeks = Math.max(monthStrengthWeeks.size, 1);
  const numMonthActivityWeeks = Math.max(monthActivityWeeks.size, 1);
  const totalRunMinsYear = yearRuns.reduce((s, r) => { const parts = (r.moving_time || '').split(':').map(Number); return s + (parts[0] * 60 + (parts[1] || 0) + (parts[2] || 0) / 60); }, 0);
  const monthRunMins = monthRuns.reduce((s, r) => { const parts = (r.moving_time || '').split(':').map(Number); return s + (parts[0] * 60 + (parts[1] || 0) + (parts[2] || 0) / 60); }, 0);
  const monthStrengthMins = monthSessions.reduce((s, r) => s + (parseFloat(r.duration_min) || 0), 0);
  const totalActivityMinsYear = totalRunMinsYear + totalStrengthMinYear;
  const avgActivityMinsPerWeek = totalActivityMinsYear / numActivityWeeks;
  const avgActivityMinsPerWeekMonth = (monthRunMins + monthStrengthMins) / numMonthActivityWeeks;
  const latestLT = ltData.length > 0 ? ltData[ltData.length - 1] : null;

  let stepsData = {};
  if (stepsRaw) { const { data: stepsRows } = Papa.parse(stepsRaw, { header: true, skipEmptyLines: true }); stepsRows.forEach(r => { if (r.date) stepsData[r.date] = parseInt(r.steps) || 0; }); }
  const STEP_GOAL = 10000;

  // ── Sleep data (Recovery row) ──────────────────────────────────────────────────
  let sleepData = {};
  if (sleepRaw) {

  // ── Coach card ────────────────────────────────────────────────────────────────

    const headlineHtml = coachData.headline ? `<div class="coach-headline">${escapeHtml(coachData.headline)}</div>` : '';
    const watchItems = Array.isArray(coachData.watch_items) ? coachData.watch_items.filter(Boolean) : [];
    const watchHtml = watchItems.length ? `<div class="coach-watch"><div class="coach-watch-title">Things to watch</div>${watchItems.map(w => `<div class="coach-watch-item">${escapeHtml(w)}</div>`).join('')}</div>` : '';
    function usageColor(usd) { if (usd < 0.004) return '#4a9eff'; if (usd < 0.008) return '#7bc67e'; if (usd < 0.015) return '#e8ff5a'; if (usd < 0.025) return '#ff9f40'; return '#ff6b35'; }
    function mtdColor(usd) { if (usd < 0.10) return '#4a9eff'; if (usd < 0.25) return '#7bc67e'; if (usd < 0.35) return '#e8ff5a'; if (usd < 0.42) return '#ff9f40'; return '#ff6b35'; }

    coachCard.innerHTML = `<div class="coach-header"><span class="coach-dot"></span>Training status</div>${headlineHtml}${parasHtml}${watchHtml}<div class="coach-updated">Generated ${coachData.last_updated}</div>${usageHtml}`;

  }

  // ── Overview block ────────────────────────────────────────────────────────────
  const stepsOverviewData = (() => {
    if (!Object.keys(stepsData || {}).length) return null;
    const allVals = Object.entries(stepsData).filter(([d, v]) => v > 0 && d <= lastCompleteDate);
    const avg7d = (() => { const days = []; for (let i = 1; i <= 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); const ds = localDate(d); if (stepsData[ds]) days.push(stepsData[ds]); } return days.length ? Math.round(days.reduce((s, v) => s + v, 0) / days.length) : null; })();
    const cutoff30d = new Date(); cutoff30d.setDate(cutoff30d.getDate() - 30);
    const last30d = allVals.filter(([d]) => parseLocalDate(d) >= cutoff30d);
    const avg30d = last30d.length ? Math.round(last30d.reduce((s, [, v]) => s + v, 0) / last30d.length) : null;
    const avgAll = allVals.length ? Math.round(allVals.reduce((s, [, v]) => s + v, 0) / allVals.length) : null;
    return { avgAll, avg7d, avg30d };
  })();

  // ── Recovery (sleep) overview data ─────────────────────────────────────────────
  const recoveryOverviewData = (() => {
    const entries = Object.entries(sleepData).filter(([d, v]) => v.minutes > 0 && d <= todayIso);
    if (!entries.length) return null;

    const avgOf = (pairs) => {
      const mins = pairs.filter(([, v]) => v.minutes > 0);

      return {
        mins: mins.length ? mins.reduce((s, [, v]) => s + v.minutes, 0) / mins.length : null,

      };

    const cutoff7d = new Date(); cutoff7d.setDate(cutoff7d.getDate() - 7);
    const cutoff30d = new Date(); cutoff30d.setDate(cutoff30d.getDate() - 30);

  const INTENSITY_GOAL_MINS = 210;

  yearRuns.forEach(r => { const wk = isoWeek(r.date); const parts = (r.moving_time || '').split(':').map(Number); const mins = parts[0] * 60 + (parts[1] || 0) + (parts[2] || 0) / 60; weekMinMap[wk] = (weekMinMap[wk] || 0) + mins; });

  const sortedWeekKeys = Object.keys(weekMinMap).sort();

  for (let i = intensityWeekKeys.length - 1; i >= 0; i--) { if ((weekMinMap[intensityWeekKeys[i]] || 0) >= INTENSITY_GOAL_MINS) intensityStreak++; else break; }

  const stepsRow = stepsOverviewData ? `<div class="overview-full"><div class="overview-label intensity" style="grid-column:1/-1;color:var(--steps)">Steps</div><div class="stat"><span class="stat-label">Avg / day (all time)</span><span class="stat-value" style="color:var(--steps)">${stepsOverviewData.avgAll?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps</span></div><div class="stat"><span class="stat-label">Avg / day (7d)</span><span class="stat-value" style="color:var(--steps)">${stepsOverviewData.avg7d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps__STEPS_DELTA__</span></div><div class="stat"><span class="stat-label">Avg / day (30d)</span><span class="stat-value" style="color:var(--steps)">${stepsOverviewData.avg30d?.toLocaleString() ?? '—'}</span><span class="stat-sub">steps</span></div></div>` : '';

  const recoveryTile = (label, data, deltaHtml) => {

  };

  const recoveryRow = recoveryOverviewData ? `<div class="overview-full"><div class="overview-label recovery" style="grid-column:1/-1">Recovery</div>${recoveryTile('Avg / week', recoveryOverviewData.week, '__RECOVERY_DELTA__')}${recoveryTile('Avg / month', recoveryOverviewData.month)}${recoveryTile('Avg / year', recoveryOverviewData.year)}</div>` : '';

  // ── Change indicators (▲▼▬) — value-neutral, direction + magnitude only ───────
  function deltaBadge(delta, formatFn) {

  const prevCompleteWeek = shiftWeekKey(lastCompleteWeek, -1);

  const weekStrengthCount = wk => sessionsComplete.filter(s => isoWeek(s.date) === wk).length;
  const runWeekDelta = weekRunDist(lastCompleteWeek) - weekRunDist(prevCompleteWeek);
  const strengthWeekDelta = weekStrengthCount(lastCompleteWeek) - weekStrengthCount(prevCompleteWeek);
  const stepsDelta = (stepsOverviewData && stepsOverviewData.avg7d !== null && stepsOverviewData.avg30d !== null) ? stepsOverviewData.avg7d - stepsOverviewData.avg30d : null;
  const intensityDelta = avgActivityMinsPerWeekMonth - avgActivityMinsPerWeek;
  const recoveryDelta = (recoveryOverviewData && recoveryOverviewData.week.mins !== null && recoveryOverviewData.month.mins !== null) ? recoveryOverviewData.week.mins - recoveryOverviewData.month.mins : null;

  const runDeltaHtml = deltaBadge(runWeekDelta, v => `${v.toFixed(1)} km vs last wk`);

  const overviewBlock = document.createElement('div');

  overviewBlock.innerHTML = `
    <div class="overview-full">

      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(avgRunDistPerWeek, 1)} <small style="font-size:.9rem;color:var(--text-dim)">km</small></span><span class="stat-sub">${fmt(summary?.total_distance_this_year_km ?? yearDist, 0)} km ${thisYear}${runDeltaHtml}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value accent">${summary?.current_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${summary?.longest_weekly_streak ?? '—'} wks</span></div>
    </div>

      <div class="stat"><span class="stat-label">Avg / week</span><span class="stat-value">${fmt(totalStrengthMinYear / numSWeeks / 60, 1)} <small style="font-size:.9rem;color:var(--text-dim)">hrs</small></span><span class="stat-sub">${(totalStrengthMinYear / 60).toFixed(1)} hrs ${thisYear}</span></div>
      <div class="stat"><span class="stat-label">Weekly streak</span><span class="stat-value blue">${summary?.current_strength_weekly_streak ?? '—'} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${summary?.longest_strength_weekly_streak ?? '—'} wks</span></div>
    </div>
    ${stepsRowResolved}
    <div class="overview-full">
      <div class="overview-label intensity" style="grid-column:1/-1">Intensity Minutes</div>
      <div class="stat"><span class="stat-label">Avg / week (${thisYear})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(avgActivityMinsPerWeek)}</span><span class="stat-sub">${fmtHrs(totalRunMinsYear / numRunWeeks)} run · ${fmtHrs(totalStrengthMinYear / numSWeeks)} lift</span></div>
      <div class="stat"><span class="stat-label">Avg / week (${thisMonth})</span><span class="stat-value" style="color:var(--intensity)">${fmtHrs(avgActivityMinsPerWeekMonth)}</span><span class="stat-sub">${fmtHrs(monthRunMins / numMonthRunWeeks)} run · ${fmtHrs(monthStrengthMins / numMonthStrengthWeeks)} lift${intensityDeltaHtml}</span></div>
      <div class="stat"><span class="stat-label">Streak vs ${INTENSITY_GOAL_MINS}min goal</span><span class="stat-value" style="color:var(--intensity)">${intensityStreak} <small style="font-size:.9rem;color:var(--text-dim)">wks</small></span><span class="stat-sub">Best: ${bestIntensityStreak} wks</span></div>
    </div>
    ${recoveryRowResolved}
  `;
  app.appendChild(overviewBlock);

  // ── Week map (needed before charts) ──────────────────────────────────────────
  const weekMap = {};
  runsComplete.forEach(r => { const wk = isoWeek(r.date); if (!weekMap[wk]) weekMap[wk] = { dist: 0 }; weekMap[wk].dist += parseFloat(r.distance_km) || 0; });
  const weekKeys = Object.keys(weekMap).sort().slice(-16);
  const monthNamesShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ── sWeekMap (needed before charts) ──────────────────────────────────────────
  const sWeekMap = {};
  sessionsComplete.forEach(s => { const wk = isoWeek(s.date); if (!sWeekMap[wk]) sWeekMap[wk] = { count: 0 }; sWeekMap[wk].count++; });

  // ── Combined week data ────────────────────────────────────────────────────────
  const allWeekSet = new Set([...Object.keys(weekMap), ...Object.keys(sWeekMap)]);
  const combinedWeekKeys = [...allWeekSet].sort().slice(-16);
  const combinedRunDist = combinedWeekKeys.map(k => parseFloat((weekMap[k]?.dist || 0).toFixed(1)));
  const combinedStrSess = combinedWeekKeys.map(k => sWeekMap[k]?.count || 0);
  const combinedLabels = combinedWeekKeys.map(k => k.split('-')[1]);
  const combinedMonthBoundary = combinedWeekKeys.map((k, i) => { if (i === 0) return false; return weekStartDate(k).getMonth() !== weekStartDate(combinedWeekKeys[i-1]).getMonth(); });
  const combinedMonthLabel = combinedWeekKeys.map(k => monthNamesShort[weekStartDate(k).getMonth()]);
  const maxDist = Math.max(...combinedRunDist, 1);
  const maxSess = Math.max(...combinedStrSess, 1);

  // ── Annual data (needed before charts) ───────────────────────────────────────
  const prevYearDist = summary?.total_distance_prev_year_km ?? null;
  const targetKm = prevYearDist && prevYearDist > 0 ? prevYearDist : 2000;
  const targetLabel = prevYearDist && prevYearDist > 0 ? `vs ${today.getFullYear() - 1} total (${fmt(targetKm, 0)} km)` : 'Progress to 2,000 km';
  const rawPct = (yearDist / targetKm) * 100;
  const displayPct = Math.min(rawPct, 130);
  const isOverflow = yearDist > targetKm;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthDist = Array(12).fill(0);
  yearRuns.forEach(r => { const mo = parseLocalDate(r.date).getMonth(); monthDist[mo] += parseFloat(r.distance_km) || 0; });
  const currentMonth = today.getMonth();
  const monthLabels = months.slice(0, currentMonth + 1);
  const monthData = monthDist.slice(0, currentMonth + 1);
  const prevYear = (today.getFullYear() - 1).toString();
  const monthStrength = Array(12).fill(0);
  yearSessions.forEach(s => { const mo = parseLocalDate(s.date).getMonth(); monthStrength[mo]++; });
  const monthStrengthData = monthStrength.slice(0, currentMonth + 1);
  const totalStrengthThisYear = yearSessions.length;
  const totalStrengthPrevYear = sessions.filter(s => s.date.startsWith(prevYear)).length;
  const strengthPct = totalStrengthPrevYear > 0 ? Math.round((totalStrengthThisYear / totalStrengthPrevYear) * 100) : null;
  const strengthOverflow = totalStrengthPrevYear > 0 && totalStrengthThisYear > totalStrengthPrevYear;
  const strengthDisplayPct = strengthPct !== null ? Math.min(strengthPct, 130) : 0;

  // ── 16-week chart card ────────────────────────────────────────────────────────
  const comparisonGrid = document.createElement('div');
  comparisonGrid.className = 'card';
  comparisonGrid.innerHTML = `<div class="card-title">Weekly distance & strength — last 16 weeks</div><div class="chart-wrap"><canvas id="optionAChart"></canvas></div>`;
  app.appendChild(comparisonGrid);

  // ── Annual chart card (right after 16-week) ───────────────────────────────────
  const grid1 = document.createElement('div');
  grid1.className = 'card';
  grid1.innerHTML = `

      </div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem">

          <span style="font-family:var(--font-display);font-size:1.4rem;color:${strengthOverflow ? 'var(--accent2)' : 'var(--strength)'}">${strengthPct !== null ? strengthPct + '%' : totalStrengthThisYear}</span>
        </div>
        <div class="year-bar-track"><div class="year-bar-fill${strengthOverflow ? ' overflow' : ''}" style="width:${strengthDisplayPct}%;background:var(--strength)"></div></div>
        <div class="year-bar-labels"><span>${totalStrengthThisYear} sessions done</span><span>${totalStrengthPrevYear > 0 ? (strengthOverflow ? '+' + (totalStrengthThisYear - totalStrengthPrevYear) + ' ahead' : (totalStrengthPrevYear - totalStrengthThisYear) + ' to match') : ''}</span></div>
      </div>

    <div class="chart-wrap" style="height:200px"><canvas id="monthChart"></canvas></div>

  app.appendChild(grid1);

  const ltCard = document.createElement('div');
  ltCard.className = 'card';
  if (latestLT) {
    const zonesHtml = zones ? zones.map(z => `<div class="zone"><span class="zone-name">${z.name}</span><div class="zone-bar-track"><div class="zone-bar-fill" style="width:${z.pct}%;background:${z.color}"></div></div><span class="zone-pace">${z.pace}${z.hr ? ' · ' + z.hr : ''}</span></div>`).join('') : '';
    const ltTrendHtml = ltData.length > 1 ? `<div class="chart-wrap" style="height:100px;margin-top:1rem"><canvas id="ltChart"></canvas></div>` : `<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:1rem">Trend builds daily — check back soon.</p>`;
    ltCard.innerHTML = `<div class="card-title">Lactate threshold</div><div class="lt-grid"><div class="lt-values"><div class="lt-main"><span class="lt-label">LT pace</span><span class="lt-pace">${latestLT.lt_pace} /km</span><span class="lt-hr">@ ${latestLT.lt_hr} bpm · ${latestLT.lt_source_date ?? latestLT.date}</span></div></div><div><div class="lt-label" style="margin-bottom:0.75rem">Training zones</div><div class="zones">${zonesHtml}</div></div></div>${ltTrendHtml}`;
  } else {
    ltCard.innerHTML = `<div class="card-title">Lactate threshold</div><p style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim)">No valid LT reading yet — recalibrating after a data fix.</p>`;
  }
  app.appendChild(ltCard);

  // ── Activity calendar ─────────────────────────────────────────────────────────
  const calCard = document.createElement('div');
  calCard.className = 'card';
  calCard.id = 'calCard';
  app.appendChild(calCard);

  function renderCalendar(year, month) {
    const runDates = new Set(runs.map(r => r.date));
    const strengthDates = new Set(sessions.map(s => s.date));
    const now = new Date();
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dayLabels = ['M','T','W','T','F','S','S'];
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;
    const todayStr = localDate(now);
    const runIcon = (color = '#e8ff5a') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><circle cx="10" cy="3" r="1.5" fill="${color}"/><path d="M7 5.5l1.5-2 2 1-1 2.5-2.5 1L5 11H3" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8l-2 3" stroke="${color}" stroke-width="1.2" stroke-linecap="round"/></svg>`;
    const strengthIcon = (color = '#4a9eff') => `<svg class="cal-icon" viewBox="0 0 14 14" fill="none"><rect x="1" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="11" y="6" width="2" height="3" rx="0.5" fill="${color}"/><rect x="3" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="9" y="5" width="2" height="5" rx="0.5" fill="${color}"/><rect x="5" y="6.5" width="4" height="2" rx="0.5" fill="${color}"/></svg>`;
    let dayCells = '';
    // Leading blank cells so day 1 lands in the correct weekday column.
    for (let i = 0; i < startDow; i++) {
      dayCells += `<div class="cal-day"></div>`;
    }
    const calRows = [];
    let currentRow = [];
    for (let i = 0; i < startDow; i++) currentRow.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) {
      const dateStr = localDate(new Date(year, month, d));
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;
      const hasRun = runDates.has(dateStr);
      const hasStrength = strengthDates.has(dateStr);
      const hasActivity = hasRun || hasStrength;
      const cls = ['cal-day', isToday ? 'today' : '', isFuture ? 'future' : '', hasActivity ? 'has-activity' : ''].filter(Boolean).join(' ');
      dayCells += `<div class="${cls}"><div class="cal-day-num">${d}</div>${hasActivity ? `<div class="cal-icons">${hasRun ? runIcon() : ''}${hasStrength ? strengthIcon() : ''}</div>` : ''}</div>`;
      currentRow.push(dateStr);
      if (currentRow.length === 7) { calRows.push([...currentRow]); currentRow = []; }
    }
    if (currentRow.length > 0) { while (currentRow.length < 7) currentRow.push(null); calRows.push([...currentRow]); }
    const streakCol = calRows.map(row => row.filter(Boolean).some(d => runDates.has(d)));
    const todayRowIdx = calRows.findIndex(row => row.includes(todayStr));
    const currentStreak = summary?.current_weekly_streak ?? 0;
    const rowsHtml = calRows.map((row, ri) => { const isCurrentRow = ri === todayRowIdx; const done = streakCol[ri]; const streakCell = isCurrentRow ? `<div class="streak-week current-fire">🔥</div>` : `<div class="streak-week ${done ? 'done' : 'empty'}">${done ? '✓' : ''}</div>`; return `<div class="cal-row-wrap">${streakCell}</div>`; }).join('');
    calCard.innerHTML = `<div class="card-title">Activity calendar</div><div class="cal-header"><div class="cal-title">${monthNames[month]} ${year}</div><div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div></div><div class="cal-with-streak"><div class="cal-grid">${dayLabels.map(l => `<div class="cal-day-label">${l}</div>`).join('')}${dayCells}</div><div class="streak-col"><div class="streak-col-spacer"></div>${rowsHtml}<div class="streak-total"><div class="streak-count">${currentStreak}</div><div class="streak-label">wks</div></div></div></div>`;
    $('calPrev').onclick = () => { if (month === 0) renderCalendar(year - 1, 11); else renderCalendar(year, month - 1); };
    $('calNext').onclick = () => { const n = new Date(); const maxY = n.getFullYear(), maxM = n.getMonth(); if (year < maxY || (year === maxY && month < maxM)) month === 11 ? renderCalendar(year + 1, 0) : renderCalendar(year, month + 1); };
  }
  renderCalendar(today.getFullYear(), today.getMonth());

  // ── Running section ───────────────────────────────────────────────────────────
  const runHeading = document.createElement('div');
  runHeading.className = 'section-heading';
  runHeading.textContent = 'Running';
  app.appendChild(runHeading);

  const efforts = calcBestEfforts(runsComplete.filter(r => r.type === 'outdoor'));
  const effortsCard = document.createElement('div');
  effortsCard.className = 'card';
  effortsCard.innerHTML = `<div class="card-title">Personal bests — by distance category</div><div class="efforts-grid">${efforts.map(e => `<div class="effort"><div class="effort-label">${e.label}</div><div class="effort-value">${e.pace}</div><div class="effort-detail">${e.time} · ${e.dist}</div><div class="effort-sub">${escapeHtml(e.name)}</div><div class="effort-date">${e.date ?? ''}</div></div>`).join('')}</div>`;
  app.appendChild(effortsCard);

  // ── Render charts ─────────────────────────────────────────────────────────────
  requestAnimationFrame(() => {
    const maxMonthDist = Math.max(...monthData, 1);
    const maxMonthStr = Math.max(...monthStrengthData, 1);

    new Chart($('monthChart'), {
      type: 'bar',
      data: { labels: monthLabels, datasets: [
        { type: 'line', label: 'Distance (km)', data: monthData.map(v => parseFloat(v.toFixed(1))), borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.08)', pointBackgroundColor: monthData.map((_, i) => i === currentMonth ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 4, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yDist', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: monthStrengthData, backgroundColor: monthStrengthData.map((_, i) => i === currentMonth ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.25)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yDist: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxMonthDist * 1.2) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxMonthStr + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yDist' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } }
    });

    const makeMonthPlugin = (id, boundaries, labels) => ({ id, afterDraw(chart) { const { ctx, chartArea, scales } = chart; ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([3,3]); ctx.font = '9px "DM Mono", monospace'; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.textAlign = 'left'; boundaries.forEach((isBoundary, i) => { if (isBoundary) { const x = scales.x.getPixelForValue(i) - (scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0)) / 2; ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke(); ctx.setLineDash([]); ctx.fillText(labels[i], x + 4, chartArea.top + 10); ctx.setLineDash([3,3]); } }); ctx.restore(); } });

    new Chart($('optionAChart'), {
      type: 'bar',
      data: { labels: combinedLabels, datasets: [
        { type: 'line', label: 'Distance (km)', data: combinedRunDist, borderColor: 'rgba(232,255,90,0.9)', backgroundColor: 'rgba(232,255,90,0.12)', pointBackgroundColor: combinedRunDist.map((_, i) => i === combinedRunDist.length-1 ? 'rgba(255,107,53,1)' : 'rgba(232,255,90,0.9)'), pointBorderColor: 'transparent', pointRadius: 3, borderWidth: 2, tension: 0.35, fill: true, yAxisID: 'yRun', order: 1 },
        { type: 'bar', label: 'Strength sessions', data: combinedStrSess, backgroundColor: combinedStrSess.map((_, i) => i === combinedStrSess.length-1 ? 'rgba(74,158,255,0.7)' : 'rgba(74,158,255,0.3)'), borderRadius: 2, yAxisID: 'yStr', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14 } }, scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, yRun: { type: 'linear', position: 'left', grid: { color: '#1f1f24' }, ticks: { color: '#e8ff5a', callback: v => `${v}km` }, min: 0, max: Math.ceil(maxDist * 1.15) }, yStr: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#4a9eff', stepSize: 1, callback: v => Number.isInteger(v) ? `${v}s` : '' }, min: 0, max: Math.max(maxSess + 1, 4) } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#6b6b78', font: { family: "'DM Mono', monospace", size: 10 }, boxWidth: 12 } }, tooltip: { backgroundColor: '#141417', borderColor: '#1f1f24', borderWidth: 1, titleColor: '#eeeef4', bodyColor: '#c8c8d4', padding: 10, callbacks: { label: ctx => ctx.dataset.yAxisID === 'yRun' ? ` ${ctx.parsed.y} km` : ` ${ctx.parsed.y} session${ctx.parsed.y !== 1 ? 's' : ''}` } } } },
      plugins: [makeMonthPlugin('optionAMonthLines', combinedMonthBoundary, combinedMonthLabel)]
    });

    if ($('ltChart') && ltData.length > 1) {
      const ltSorted = [...ltData].sort((a, b) => a.date.localeCompare(b.date));
      const ltSecs = ltSorted.map(r => paceToSec(r.lt_pace));
      const ltTrend = linearTrend(ltSecs);
      new Chart($('ltChart'), { type: 'line', data: { labels: ltSorted.map(r => r.date.slice(5)), datasets: [ { data: ltSecs, borderColor: 'rgba(232,255,90,0.8)', backgroundColor: 'rgba(232,255,90,0.06)', pointBackgroundColor: 'rgba(232,255,90,0.9)', pointRadius: 4, tension: 0.3, fill: true }, { data: ltTrend, borderColor: 'rgba(255,107,53,0.7)', borderWidth: 1.5, borderDash: [4,3], pointRadius: 0, fill: false, tension: 0 } ] }, options: { ...chartOpts(), scales: { x: { grid: { display: false }, ticks: { color: '#6b6b78' } }, y: { reverse: true, grid: { color: '#1f1f24' }, ticks: { color: '#6b6b78', callback: v => secToPace(v) } } }, plugins: { ...chartOpts().plugins, tooltip: { ...chartOpts().plugins.tooltip, callbacks: { label: ctx => ctx.datasetIndex === 0 ? ` LT pace: ${secToPace(ctx.parsed.y)} /km` : ` Trend` } } } } });
    }
  });
}

init().catch(err => { document.getElementById('app').innerHTML = `<div class="loading">Failed to load data.<br><small>${err.message}</small></div>`; });
</script>
</body>
</html>
